<script>
/* ---------------------------------------------------------------------
   Pequeno executor: cada teste() agrupa várias conferências (confere).
   Um erro dentro do teste vira um resultado vermelho, sem parar os outros.
   --------------------------------------------------------------------- */
const resultados = [];
let grupoAtual = '';

// Guarda um resultado: nome do que foi conferido, se passou e um detalhe para quem lê.
function confere(nome, passou, detalhe){
  resultados.push({ grupo: grupoAtual, nome, passou: !!passou, detalhe: detalhe || '' });
}

// Roda um grupo de conferências; erro inesperado conta como falha.
async function teste(nome, fn){
  grupoAtual = nome;
  try{ await fn(); }catch(err){ confere(nome, false, 'erro: ' + (err && err.message || err)); }
}

// Monta um Excel fictício (SheetJS) com as linhas dadas e devolve como File,
// como se o usuário tivesse escolhido o arquivo. celulas: { 'A2': {t:'n', v:...} } troca células.
function excelFicticio(linhas, celulas){
  const aba = XLSX.utils.aoa_to_sheet(linhas);
  Object.assign(aba, celulas || {});
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, aba, 'Planilha1');
  const bytes = XLSX.write(wb, { type:'array', bookType:'xlsx' });
  return new File([bytes], 'ficticio.xlsx');
}

// Monta um PDF fictício de 1 página (texto em Helvetica) e devolve como File.
// textos = [{ top, x, texto }]: top e x em pontos, contando do canto de cima à esquerda,
// como no PDF do banco. Só letras do Latin-1 (ç, á, é, ô...).
function pdfFicticio(textos, nome){
  const L = 623.63, A = 963.79, TAM = 8.29;
  const escapa = t => t.replace(/[\\()]/g, c => '\\' + c);
  const conteudo = textos.map(({ top, x, texto }) =>
    `BT /F1 ${TAM} Tf 1 0 0 1 ${x.toFixed(2)} ${(A - top - TAM * 0.793).toFixed(2)} Tm (${escapa(texto)}) Tj ET`).join('\n');
  const objetos = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${L} ${A}] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>`,
    `<< /Length ${conteudo.length} >>\nstream\n${conteudo}\nendstream`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
  ];
  let pdf = '%PDF-1.4\n';
  const posicoes = objetos.map((o, i) => { const p = pdf.length; pdf += `${i + 1} 0 obj\n${o}\nendobj\n`; return p; });
  const xref = pdf.length;
  pdf += `xref\n0 ${objetos.length + 1}\n0000000000 65535 f \n` + posicoes.map(p => String(p).padStart(10, '0') + ' 00000 n \n').join('') +
         `trailer\n<< /Size ${objetos.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new File([Uint8Array.from(pdf, c => c.charCodeAt(0))], nome || 'Bradesco_ficticio.pdf', { type:'application/pdf' });
}

// Textos de um DDA do Bradesco fictício, no layout do PDF do banco: topo (empresa, período),
// cabeçalho da tabela, um bloco de 6 linhas por boleto e o rodapé "SAC".
// opcoes: xBenef/xValor = onde começam as colunas do beneficiário e do valor (para simular
// o PDF com colunas deslocadas); semStatus = índices dos boletos sem a linha "A PAGAR";
// valorGrudado = cabeçalho com "DestinatárioValor" numa palavra só (como alguns PDFs do banco);
// xRotuloValor = x da palavra "Valor" do cabeçalho, quando ela não fica em cima dos "R$";
// benefNaLinhaDoPagador = "Beneficiário," na mesma linha de "Pagador," (outro layout do banco).
function textosDdaBradesco(cnpjConta, boletos, opcoes){
  const { xBenef = 362.9, xValor = 540.5, semStatus = [], valorGrudado = false, xRotuloValor = xValor,
          benefNaLinhaDoPagador = false } = opcoes || {};
  const topBenef = benefNaLinhaDoPagador ? 235.8 : 241.2;
  const cabecalhoValor = valorGrudado
    ? [{ top:topBenef, x:xBenef - 7.5, texto:'Beneficiário, CPF/CNPJ e Banco DestinatárioValor' }]
    : [{ top:topBenef, x:xBenef - 7.5, texto:'Beneficiário, CPF/CNPJ e Banco Destinatário' }, { top:241.2, x:xRotuloValor, texto:'Valor' }];
  const t = [
    { top:43,    x:155.1, texto:'Boletos de Cobrança Registrados/DDA' },
    { top:58,    x:155.1, texto:'EMPRESA FICTICIA S.A | 0' + cnpjConta },
    { top:82.9,  x:155.1, texto:'Data da operação : 01/12/2026 - 09h00' },
    { top:209.8, x:50.5,  texto:'Data de Vencimento:' },
    { top:210,   x:137.8, texto:'20/11/2026 até 20/11/2026' },
    { top:235.8, x:180.7, texto:'Pagador, CPF/CNPJ e' },
    { top:239.5, x:40.3,  texto:'Data de Vencimento /' },
    ...cabecalhoValor,
    { top:246.6, x:180.7, texto:'Número de documento' },
    { top:250.3, x:40.3,  texto:'Débito e Limite de Pagamento' },
  ];
  boletos.forEach((b, k) => {
    const y = 273 + 48.2 * k;
    t.push({ top:y, x:188.2, texto:b.pagador }, { top:y, x:xBenef, texto:b.benef },
           { top:y + 7.5, x:40.3, texto:b.venc }, { top:y + 7.6, x:xValor, texto:'R$ ' + b.valor },
           { top:y + 10.8, x:188.2, texto:b.pagadorCnpj }, { top:y + 10.8, x:xBenef, texto:b.cnpj },
           { top:y + 18.3, x:40.3, texto:b.limite },
           { top:y + 21.6, x:188.2, texto:b.doc }, { top:y + 21.6, x:xBenef, texto:b.banco });
    if(!semStatus.includes(k)) t.push({ top:y + 29.2, x:40.3, texto:'A PAGAR' });
  });
  const fim = 273 + 48.2 * boletos.length + 20;
  t.push({ top:fim, x:51.9, texto:'SAC - Serviço de Alô Bradesco' }, { top:fim + 34, x:47.8, texto:'Ouvidoria 0800 000 0000' });
  return t;
}

// Desenha o placar e a lista (com textContent: o detalhe pode ter texto qualquer).
function mostraResultados(){
  const lista = document.getElementById('lista');
  resultados.forEach(r => {
    const li = document.createElement('li');
    li.className = r.passou ? 'ok' : 'falha';
    const marca = document.createElement('span');
    marca.className = 'marca'; marca.setAttribute('aria-hidden', 'true');
    marca.textContent = r.passou ? '✓' : '✗';
    const corpo = document.createElement('div');
    const grupo = document.createElement('p'); grupo.className = 'grupo-teste'; grupo.textContent = r.grupo;
    const nome = document.createElement('p'); nome.className = 'nome'; nome.textContent = r.nome;
    corpo.append(grupo, nome);
    if(r.detalhe){ const d = document.createElement('p'); d.className = 'detalhe'; d.textContent = r.detalhe; corpo.append(d); }
    li.append(marca, corpo);
    lista.append(li);
  });
  const falhas = resultados.filter(r => !r.passou).length;
  const placar = document.getElementById('placar');
  placar.className = 'placar mensagem ' + (falhas ? 'mensagem-alerta' : 'mensagem-ok');
  placar.textContent = falhas ? `✗ ${falhas} de ${resultados.length} testes falharam` : `✓ Todos os ${resultados.length} testes passaram`;
  document.title = (falhas ? '✗ ' : '✓ ') + 'Testes da Conferência';
  window.resultadoDosTestes = { total: resultados.length, falhas, resultados };
}

/* ---------------------------------------------------------------------
   TESTES — só dados fictícios
   --------------------------------------------------------------------- */
async function rodaTestes(){
  // boleto fictício: banco 341, R$ 1.234,56, vencimento 23/10/2026 (do projeto antigo)
  const ESP = { banco:'341', valor:1234.56, venc:'23/10/2026' };
  const CB = '34191160800001234561234567890123456789012345';
  const LINHA = '34191234546789012345767890123457116080000123456';

  // ---------- módulo de boleto (testes do projeto antigo) ----------
  await teste('Boleto: código válido', () => {
    const r = validaBoleto(CB, ESP);
    const d = decodifica(CB);
    confere('Código válido → linha digitável certa', r.ok && r.linha === LINHA, `linha ${r.linha}`);
    confere('Código válido → banco 341, valor R$ 1.234,56, vencimento 23/10/2026',
      d.banco === '341' && d.valor === 1234.56 && d.venc === '23/10/2026', `banco ${d.banco} · ${brl(d.valor)} · ${d.venc}`);
    confere('Linha digitável → volta para o mesmo código de barras', linhaParaBarras(LINHA) === CB && validaBoleto(LINHA, ESP).cb === CB, linhaParaBarras(LINHA));
  });

  await teste('Boleto: um dígito trocado', () => {
    const r = validaBoleto('34191234546789012345767891123457116080000123456', ESP);
    confere('Um dígito trocado na linha → bloqueado, sem linha digitável', !r.ok && r.linha === '' && r.cb === '', r.motivo);
  });

  await teste('Boleto: código vindo como número', () => {
    const r = validaBoleto('3.4191160800001234e+43', ESP);
    confere('Código "3.4191160800001234e+43" → bloqueado como "ilegível"', !r.ok && r.linha === '' && /ilegível/.test(r.motivo), r.motivo);
  });

  // ---------- módulo de boleto (outros bloqueios do mesmo código antigo) ----------
  await teste('Boleto: DVs', () => {
    confere('DV geral (módulo 11) do código fictício = 1', dvMod11Geral(CB) === 1 && CB[4] === '1', `DV ${dvMod11Geral(CB)}`);
    confere('DVs dos 3 campos (módulo 10) = 4, 7 e 7', dvMod10(LINHA.slice(0, 9)) === 4 && dvMod10(LINHA.slice(10, 20)) === 7 && dvMod10(LINHA.slice(21, 31)) === 7,
      `${dvMod10(LINHA.slice(0, 9))}, ${dvMod10(LINHA.slice(10, 20))}, ${dvMod10(LINHA.slice(21, 31))}`);
    const trocaDv = CB.slice(0, 4) + '2' + CB.slice(5);
    const r = validaEstrutura(trocaDv);
    confere('DV geral errado → bloqueado', !r.ok && /módulo 11/.test(r.motivo), r.motivo);
  });

  await teste('Boleto: comparação com o DDA', () => {
    const banco = validaBoleto(CB, { ...ESP, banco:'237' });
    confere('Banco do DDA diferente → bloqueado', !banco.ok && banco.linha === '' && /banco do código/.test(banco.motivo), banco.motivo);
    const valor = validaBoleto(CB, { ...ESP, valor:1234.57 });
    confere('Valor do DDA 1 centavo diferente → bloqueado', !valor.ok && valor.linha === '' && /valor do código/.test(valor.motivo), valor.motivo);
    const venc = validaBoleto(CB, { ...ESP, venc:'24/10/2026' });
    confere('Vencimento diferente → não bloqueia, só avisa', venc.ok && venc.avisos.length === 1, venc.avisos.join(' · '));
  });

  await teste('Boleto: o que não é boleto', () => {
    const consumo = validaEstrutura('8' + '1'.repeat(47));
    confere('48 dígitos começando com 8 → conta de consumo, sem linha', !consumo.ok && consumo.tipo === 'consumo' && consumo.linha === '', consumo.motivo);
    const curto = validaEstrutura(CB.slice(0, 43));
    confere('43 dígitos → bloqueado pelo tamanho', !curto.ok && /tem 43 dígitos/.test(curto.motivo), curto.motivo);
    const letra = validaEstrutura(CB.slice(0, 10) + 'A' + CB.slice(11));
    confere('Letra no meio do código → bloqueado', !letra.ok && /não são números/.test(letra.motivo), letra.motivo);
    const vazio = validaEstrutura('');
    confere('Sem código → bloqueado', !vazio.ok && /sem código/.test(vazio.motivo), vazio.motivo);
  });

  await teste('Boleto: formato impresso', () => {
    confere('Linha formatada com pontos e espaços, sem mudar nenhum dígito',
      formataLinha(LINHA) === '34191.23454 67890.123457 67890.123457 1 16080000123456' && apenasDigitos(formataLinha(LINHA)) === LINHA, formataLinha(LINHA));
  });

  // ---------- leitura do Excel: código como texto ----------
  await teste('Leitura: código de barras no Excel', async () => {
    const arq = excelFicticio([['Código de barras'], [CB], [null]], { A3: { t:'n', v:Number(CB) } });
    const leitura = await lerMatrizComTexto(arq);
    const texto = codigoBarrasDaCelula(leitura, 1, 0);
    confere('Código gravado como texto → os 44 dígitos iguais, não suspeito', !texto.suspeito && texto.digitos === CB && validaBoleto(leitura.textoDe(1, 0).texto, ESP).ok, texto.digitos);
    const numero = codigoBarrasDaCelula(leitura, 2, 0);
    const v = validaEstrutura(leitura.textoDe(2, 0).texto);
    confere('Código gravado como número → suspeito e bloqueado (nunca vira os 44 dígitos certos)',
      numero.suspeito && numero.digitos !== CB && !v.ok, `texto lido "${leitura.textoDe(2, 0).texto}" · ${v.motivo}`);
    confere('Número da linha no Excel = 3 para a 3ª linha', leitura.linhaExcel(2) === 3, `linha ${leitura.linhaExcel(2)}`);
  });

  // ---------- identificaEmpresa (1ª linha fictícia de cada formato) ----------
  await teste('Empresa: tudo em A1', () => {
    const linha = (texto) => [[texto, null, null], ['outra linha']];
    const casos = [
      ['1 CRV INDUSTRIAL LTDA                    Empresa(s): 1 / 5 /   Data/Hora : 01/01/26 08:00:00', 'crv-matriz'],
      ['5 CRV INDUSTRIAL LTDA                    Empresa(s): 1 / 5 /   Data/Hora : 01/01/26 08:00:00', 'crv-filial'],
      ['1 RUBIATABA INDUSTRIAL S A               Empresa(s): 1 /   Data/Hora : 01/01/26 08:00:00', 'rubi-matriz'],
      ['4 RUBIATABA INDUSTRIAL S A               Empresa(s): 1 / 4 /   Data/Hora : 01/01/26 08:00:00', 'rubi-filial'],
    ];
    casos.forEach(([texto, id]) => {
      const e = identificaEmpresa(linha(texto));
      confere(`"${texto.slice(0, 26).trim()} …" → ${id}`, e && e.id === id, e ? `${e.nome} · ${e.cnpj}` : 'null');
    });
  });

  await teste('Empresa: número em A1 e nome em B1', async () => {
    const e = identificaEmpresa([[5, 'CRV INDUSTRIAL LTDA                 ', 'Data/Hora :', 46000, '08:00:00']]);
    confere('A1 = 5 (número), B1 = "CRV INDUSTRIAL LTDA" → CRV Filial', e && e.id === 'crv-filial', e ? e.nome : 'null');
    const arq = excelFicticio([[1, 'Rubiatába Industrial S A', 'Data/Hora :'], ['outra linha']]);
    const lido = identificaEmpresa((await lerMatrizComTexto(arq)).matriz);
    confere('Mesmo formato lido de um Excel fictício, com acento e minúsculas → Rubi Matriz', lido && lido.id === 'rubi-matriz', lido ? lido.nome : 'null');
  });

  await teste('Empresa: não reconhece', () => {
    const casos = [
      [[['4 CRV INDUSTRIAL LTDA   Empresa(s): 1 / 4 /']], 'CRV com número 4 (não existe)'],
      [[['5 RUBIATABA INDUSTRIAL S A   Empresa(s): 1 / 5 /']], 'Rubi com número 5 (não existe)'],
      [[['1 EMPRESA FICTICIA QUALQUER LTDA   Empresa(s): 1 /']], 'outra empresa'],
      [[['CRV INDUSTRIAL LTDA   Empresa(s): 1 / 5 /']], 'sem número no começo'],
      [[['Pagador Eletrônico:', null, 'CPF/CNPJ:']], 'DDA do banco no lugar do relatório'],
      [[[null, null, null]], '1ª linha vazia'],
      [[], 'planilha vazia'],
    ];
    casos.forEach(([matriz, nome]) => {

    confere('"EMPRESTIMO CONSIGNADO FOLHA" → bloco "Folha e impostos", uma linha por tipo, não aparece um por um',
      folha.length === 1 && folha[0].qtd === 3 && folha[0].valor === 600 && umPorUm.length === 0 &&
      abas.sem.some(r => r.status === 'faixa' && /Folha e impostos/.test(r.fornecedor)),
      folha.length ? `${folha[0].fornecedor} · ${folha[0].nf} · ${brl(folha[0].valor)}` : 'sem bloco');
    confere('… e o total da aba conta os 4 títulos', resumoAba(abas.sem).qtd === 4 && resumoAba(abas.sem).total === 655, `${resumoAba(abas.sem).qtd} itens · ${brl(resumoAba(abas.sem).total)}`);
  });

  await teste('Boletos: período com 2 vencimentos', async () => {
    const dda = [boletoFicticio({ beneficiario:'PI FICTICIA VIDROS', doc:'9801', valor:100.00, venc:'14/11/2026' }),
                 boletoFicticio({ beneficiario:'RHO FICTICIA TELAS', doc:'9802', valor:200.00, venc:'16/11/2026' }),
                 boletoFicticio({ beneficiario:'CHI FICTICIA ROLOS', doc:'9803', valor:250.00, venc:'16/11/2026' })];
    const tits = [tituloFicticio({ nome:'PI FICTICIA VIDROS', doc:'9801', valor:100.00, venc:'14/11/2026' }),
                  tituloFicticio({ nome:'RHO FICTICIA TELAS', doc:'9802', valor:200.00, venc:'16/11/2026' }),
                  tituloFicticio({ nome:'CHI FICTICIA ROLOS', doc:'9803', valor:250.00, venc:'16/11/2026' })];
    const abas = montaAbasBol(conferirBoletos(dda, tits), { porData:true });
    const faixas = abas.ok.filter(r => r.status === 'faixa').map(r => r.fornecedor);
    const subt = abas.ok.filter(r => r.status === 'subtotal').map(r => r.valor);
    confere('2 vencimentos → uma faixa por data, com subtotal de cada data e total geral',
      faixas.length === 2 && /14\/11\/2026 \(sábado\)/.test(faixas[0]) && /16\/11\/2026 \(segunda\)/.test(faixas[1]) &&
      subt.join('|') === '100|450' && resumoAba(abas.ok).total === 550, `${faixas.join(' · ')} · subtotais ${subt.map(brl).join(', ')}`);
    const buf = await planilhaBoletos(abas).xlsx.writeBuffer();
    const erros = await confereExcelBoletos(buf, abas);
    confere('… e o Excel com as faixas confere com a tela', erros.length === 0, erros.join(' · ') || 'ok');
  });

  // ---------- Conferência de boletos: empresa pelo seletor e travas (novo nesta versão) ----------
  // DDA do Itaú fictício (conta da empresa dada) e relatório "Duplicatas em Aberto Modelo A" fictício
  const COD_ALFA = codigoFicticio('341', '20/11/2026', 100.00, 950);
  const ddaItauBol = empresa => [
    ['Nome da empresa: EMPRESA FICTICIA'], ['CPF/CNPJ: ' + empresa.cnpj], ['Data/Hora: 20/11/2026 às 09:00:00'],
    ['Pagador/Agregado', 'Beneficiário', 'CPF/CNPJ', 'Venc.', 'Nº Doc.', 'Até Venc.', 'A Pagar', 'Tipo de Boleto', 'Banco', 'Observações', 'Código de barras'],
    ['EMPRESA FICTICIA', 'ALFA FICTICIA PECAS LTDA', '00.000.000/0001-00', '20/11/2026', '9001', 100, 100, 'DM', '341', '', COD_ALFA],
  ];
  const relatorioBol = primeiraLinha => [
    [primeiraLinha], ['Período: 20/11/2026 a 20/11/2026'],
    ['Vencto.', 'Cliente', 'Nome', 'Duplicata', 'Prf', 'Código de barras', 'Saldo'],
    ['20/11/2026', '7001', 'ALFA FICTICIA PECAS', '9001', '1', '', 100],
    ['Total', '', '', '', '', '', 100],
  ];
  const LINHA_CRV_MATRIZ = '1 CRV INDUSTRIAL LTDA      Empresa(s): 1 / 5 /   Data/Hora : 20/11/26 08:00:00';
  const LINHA_CRV_FILIAL_BOL = '5 CRV INDUSTRIAL LTDA      Empresa(s): 1 / 5 /   Data/Hora : 20/11/26 08:00:00';

  await teste('Boletos: empresa e travas', async () => {
    confere('Seletor só com as empresas que têm Itaú: CRV Matriz e CRV Filial',
      empresasBoletos().map(e => e.id).join(',') === 'crv-matriz,crv-filial', empresasBoletos().map(e => e.nome).join(' · '));
    const rel = checaArquivosBoletos(crvFilial, ddaItauBol(crvFilial), relatorioBol(LINHA_CRV_MATRIZ));
    confere('Relatório da CRV Matriz com CRV Filial escolhida → bloqueado (no relatório)', /é da CRV Matriz/.test(rel.bloqueio) && rel.onde === 'sistema', rel.bloqueio);
    const conta = checaArquivosBoletos(crvMatriz, ddaItauBol(crvFilial), relatorioBol(LINHA_CRV_MATRIZ));
    confere('DDA da conta da CRV Filial com CRV Matriz escolhida → bloqueado (no DDA)', /conta da CRV Filial/.test(conta.bloqueio) && conta.onde === 'dda', conta.bloqueio);
    const santander = checaArquivosBoletos(crvFilial, ddaSantanderFicticio(crvFilial, BOLETOS), relatorioBol(LINHA_CRV_FILIAL_BOL));
    confere('DDA do Santander → bloqueado', /DDA do Santander/.test(santander.bloqueio), santander.bloqueio);
    const certo = checaArquivosBoletos(crvFilial, ddaItauBol(crvFilial), relatorioBol(LINHA_CRV_FILIAL_BOL));
    confere('Empresa, banco e conta certos → liberado', !certo.bloqueio && !certo.aviso, 'sem alerta');

    const lDda = await lerMatrizComTexto(excelFicticio(ddaItauBol(crvFilial)));
    const r = conferenciaBoletos(crvFilial, lDda, await lerMatrizComTexto(excelFicticio(relatorioBol(LINHA_CRV_FILIAL_BOL))));
    const checagens = (r.checagens || []).map(c => `${c.tipo}: ${c.titulo}`);
    confere('Arquivos fictícios certos → 1 título "Com boleto", com a linha digitável do DDA',
      !r.erro && r.abas.ok.length === 1 && r.abas.ok[0].linha === barrasParaLinha(COD_ALFA) && r.nTitulos === 1 && r.nDda === 1, r.erro || r.abas.ok.map(x => x.fornecedor).join(', '));
    confere('… e as checagens: mesma data, período e mesma empresa',
      checagens.join(' | ') === 'ok: Mesma data | ok: Período do relatório: 20/11/2026 | ok: Mesma empresa', checagens.join(' | '));
    const errado = conferenciaBoletos(crvMatriz, lDda, await lerMatrizComTexto(excelFicticio(relatorioBol(LINHA_CRV_FILIAL_BOL))));
    confere('Mesmos arquivos com CRV Matriz escolhida → não confere', errado.erro && !errado.abas, errado.erro);
  });

  await teste('Boletos: tela', () => {
    const r = linhaAbaBol('ok', { t: tituloFicticio({ nome:'<img src=x onerror=alert(1)>', doc:'1', valor:1 }), valor:1, bloco:1 });
    const tr = linhaAbaTr(r, 'ok', colunasAbaBol('ok'));
    confere('Nome com HTML aparece como texto (textContent), sem criar elemento', !tr.querySelector('img') && tr.textContent.includes('<img'), tr.textContent.slice(0, 60));
    const linha = barrasParaLinha(COD_ALFA);
    const comLinha = linhaAbaTr(linhaAbaBol('ok', { t: tituloFicticio({ nome:'ALFA FICTICIA', doc:'1', valor:100 }), linha, valor:100, bloco:2 }), 'ok', colunasAbaBol('ok'));
    const botao = comLinha.querySelector('.botao-copiar');
    confere('Linha digitável com banco, valor e vencimento lidos do código e o botão Copiar',
      botao && botao.dataset.linha === linha && /Banco 341 · R\$\s?100,00 · venc\. 20\/11\/2026/.test(comLinha.textContent) && !comLinha.querySelector('input'),
      comLinha.querySelector('.cod-bol').textContent);
  });

  // ---------- DDA → .RET: entradas (modelo .RET, empresa no modelo, DDA) — tudo FICTÍCIO ----------
  // Linha CNAB 240 fictícia: espaços, com os campos dados em { posição inicial (de 1): texto }.
  const linhaCnabFicticia = campos => {
    const l = new Array(240).fill(' ');
    Object.entries(campos).forEach(([pos, txt]) => [...txt].forEach((c, i) => { l[Number(pos) - 1 + i] = c; }));
    return l.join('');
  };
  const cnpj15 = e => apenasDigitos(e.cnpj).padStart(15, '0');
  // modelo .RET fictício: header de arquivo, um lote por empresa (com 1 boleto G fictício), trailers
  const modeloRetFicticio = (empresas, opcoes = {}) => {
    const linhas = [linhaCnabFicticia({ 1: opcoes.banco || '341', 4: '0000', 8: '0', 73: 'EMPRESA FICTICIA', 144: '19112026', 152: '160000', 158: '000123' })];
    empresas.forEach((e, i) => {
      const lote = String(i + 1).padStart(4, '0');
      linhas.push(linhaCnabFicticia({ 1: '341', 4: lote, 8: '1', 18: '2', 19: cnpj15(e), 74: opcoes.nomeLote || 'EMPRESA FICTICIA' }));
      if(!opcoes.semG) linhas.push(linhaCnabFicticia({ 1: '341', 4: lote, 8: '3', 9: '00001', 14: 'G', 18: COD_ALFA }));
      linhas.push(linhaCnabFicticia({ 1: '341', 4: lote, 8: '5' }));
    });
    linhas.push(linhaCnabFicticia({ 1: '341', 4: '9999', 8: '9' }));
    return Uint8Array.from(linhas.join('\r\n') + '\r\n', c => c.charCodeAt(0) & 0xFF);
  };
  const textoParaBytes = t => Uint8Array.from(t, c => c.charCodeAt(0) & 0xFF);

  await teste('DDA → .RET: modelo .RET', () => {
    const ok = leModeloRet(modeloRetFicticio([crvMatriz, crvFilial]));
    confere('Modelo com os lotes da matriz e da filial → aceito, com os 2 CNPJs, data e NSA',
      !ok.erro && ok.lotes.map(l => cnpjDoRetFormatado(l.cnpj)).join(',') === '03.937.452/0001-92,03.937.452/0004-35' &&
      ok.data === '19/11/2026' && ok.hora === '16:00:00' && ok.nsa === '000123' && ok.qtdBoletos === 2 && ok.headerArquivo.length === 240,
      ok.erro || `${ok.lotes.length} lotes, ${ok.data}, NSA ${ok.nsa}`);
    const curta = textoParaBytes(new TextDecoder('latin1').decode(modeloRetFicticio([crvFilial])).replace(/^(.{239}) /, '$1'));
    const rCurta = leModeloRet(curta);
    confere('Linha com 239 caracteres → recusado', /linha 1 tem 239/.test(rCurta.erro), rCurta.erro);
    const rBanco = leModeloRet(modeloRetFicticio([crvFilial], { banco:'237' }));
    confere('Header de arquivo de outro banco → recusado', /não é um \.RET do Itaú/i.test(rBanco.erro), rBanco.erro);
    const rSemG = leModeloRet(modeloRetFicticio([crvFilial], { semG:true }));
    confere('.RET sem nenhum segmento G (não é de DDA) → recusado', /segmento G/.test(rSemG.erro), rSemG.erro);
    const rAcento = leModeloRet(modeloRetFicticio([crvFilial], { nomeLote:'EMPRESA FICTÍCIA' }));
    confere('Header de lote com acento → recusado', /caractere fora do padrão/.test(rAcento.erro), rAcento.erro);
    const rVazio = leModeloRet(new Uint8Array(0));
    confere('Arquivo vazio → recusado', /vazio/.test(rVazio.erro), rVazio.erro);
  });

  await teste('DDA → .RET: empresa e DDA', async () => {
    confere('Seletor só com CRV Matriz e CRV Filial', empresasRet().map(e => e.id).join(',') === 'crv-matriz,crv-filial', empresasRet().map(e => e.nome).join(' · '));
    const soMatriz = leModeloRet(modeloRetFicticio([crvMatriz]));
    const fora = loteDaEmpresa(soMatriz, crvFilial);
    confere('Modelo só com a matriz e CRV Filial escolhida → bloqueado', !fora.lote && /não tem lote da CRV Filial/.test(fora.bloqueio), fora.bloqueio);
    const dentro = loteDaEmpresa(soMatriz, crvMatriz);
    confere('… e com CRV Matriz escolhida → usa o header de lote da matriz', dentro.lote && dentro.lote.linha.slice(18, 33) === '003937452000192', dentro.bloqueio || 'ok');

    const lDdaFilial = await lerMatrizComTexto(excelFicticio(ddaItauBol(crvFilial)));
    const excelOutra = checaDdaRet(crvMatriz, { tipo:'excel', ...lDdaFilial });
    confere('Excel do Itaú da conta da filial com CRV Matriz escolhida → bloqueado', /CRV Filial/.test(excelOutra.bloqueio), excelOutra.bloqueio);
    const semCnpj = await lerMatrizComTexto(excelFicticio(ddaItauBol(crvFilial).filter(l => !/^CPF\/CNPJ/.test(l[0])).map(l => l.map(c => /^\d{2}\.\d{3}/.test(c) ? '' : c))));
    const rSemCnpj = checaDdaRet(crvFilial, { tipo:'excel', ...semCnpj });
    confere('Excel do Itaú sem o CNPJ da conta no topo → bloqueado (no .RET não é só aviso)', /Não achei o CNPJ da conta/.test(rSemCnpj.bloqueio), rSemCnpj.bloqueio);
    const excelCerto = checaDdaRet(crvFilial, { tipo:'excel', ...lDdaFilial });
    confere('Excel do Itaú da conta certa → liberado', !excelCerto.bloqueio && !excelCerto.aviso, excelCerto.descricao);

    const pdfItau = await lerPalavrasPdf(pdfFicticio([
      { top: 20, x: 30, texto: 'Boletos Recebidos (DDA)' },
      { top: 35, x: 30, texto: 'Emitido em 19/11/2026 às 16:00:37 via Internet - 3 boleto(s) recebidos' },
    ], 'dda_itau_ficticio.pdf'));
    const pdfOk = checaDdaRet(crvFilial, { tipo:'pdf', pdf: pdfItau });
    confere('PDF "Boletos Recebidos (DDA)" → liberado, com 3 boletos e o aviso da empresa pelo seletor',
      !pdfOk.bloqueio && /3 boleto\(s\)/.test(pdfOk.descricao) && /19\/11\/2026 às 16:00:37/.test(pdfOk.descricao) && /CRV Filial/.test(pdfOk.aviso), pdfOk.descricao);
    const pdfOutro = await lerPalavrasPdf(pdfFicticio([{ top: 20, x: 30, texto: 'Extrato de conta corrente' }], 'outro.pdf'));
    const rOutro = checaDdaRet(crvFilial, { tipo:'pdf', pdf: pdfOutro });
    confere('PDF que não é o DDA do Itaú → bloqueado', /Boletos Recebidos \(DDA\)/.test(rOutro.bloqueio), rOutro.bloqueio);

    const todos = checagensEntradasRet({ empresa: crvFilial, modelo: leModeloRet(modeloRetFicticio([crvMatriz, crvFilial])), dda: { tipo:'pdf', pdf: pdfItau } });
    confere('Modelo, empresa e PDF certos → pronto (com o aviso da empresa)', todos.pronto && todos.lista.map(c => c.tipo).join(',') === 'ok,ok,ok,aviso', todos.lista.map(c => c.titulo).join(' · '));
    const travado = checagensEntradasRet({ empresa: crvFilial, modelo: soMatriz, dda: { tipo:'pdf', pdf: pdfItau } });
    confere('Empresa fora do modelo → não fica pronto', !travado.pronto, travado.lista.map(c => c.titulo).join(' · '));
  });

  mostraResultados();
}

rodaTestes().catch(err => {
  const placar = document.getElementById('placar');
  placar.className = 'placar mensagem mensagem-alerta';
  placar.textContent = 'Os testes não rodaram: ' + (err && err.message || err);
  window.resultadoDosTestes = { total: 0, falhas: 1, erro: String(err) };
});
</script>
</body>
</html>
