     do DDA → .RET (modelo .RET fictício, empresa fora do modelo, Excel de outra

<script>
/* ---------------------------------------------------------------------
   Pequeno executor: cada teste() agrupa várias conferências (confere).
   Um erro dentro do teste vira um resultado vermelho, sem parar os outros.
   --------------------------------------------------------------------- */
const resultados = [];
let grupoAtual = '';

// Guarda um resultado: nome do que foi conferido, se passou e um detalhe para quem lê.
function confere(nome, passou, detalhe){
  resultados.push({ grupo: grupoAtual, nome, passou: !!passou, detalhe: detalhe || '' });
}

// Roda um grupo de conferências; erro inesperado conta como falha.
async function teste(nome, fn){
  grupoAtual = nome;
  try{ await fn(); }catch(err){ confere(nome, false, 'erro: ' + (err && err.message || err)); }
}

// Monta um Excel fictício (SheetJS) com as linhas dadas e devolve como File,
// como se o usuário tivesse escolhido o arquivo. celulas: { 'A2': {t:'n', v:...} } troca células.
function excelFicticio(linhas, celulas){
  const aba = XLSX.utils.aoa_to_sheet(linhas);
  Object.assign(aba, celulas || {});
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, aba, 'Planilha1');
  const bytes = XLSX.write(wb, { type:'array', bookType:'xlsx' });
  return new File([bytes], 'ficticio.xlsx');
}

// Monta um PDF fictício de 1 página (texto em Helvetica) e devolve como File.
// textos = [{ top, x, texto }]: top e x em pontos, contando do canto de cima à esquerda,
// como no PDF do banco. Só letras do Latin-1 (ç, á, é, ô...).
// formato = { largura, tamanho } da página e da letra (padrão: o PDF do Bradesco).
function pdfFicticio(textos, nome, formato){
  const L = (formato && formato.largura) || 623.63, A = 963.79, TAM = (formato && formato.tamanho) || 8.29;
  const escapa = t => t.replace(/[\\()]/g, c => '\\' + c);
  const conteudo = textos.map(({ top, x, texto }) =>
    `BT /F1 ${TAM} Tf 1 0 0 1 ${x.toFixed(2)} ${(A - top - TAM * 0.793).toFixed(2)} Tm (${escapa(texto)}) Tj ET`).join('\n');
  const objetos = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${L} ${A}] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>`,
    `<< /Length ${conteudo.length} >>\nstream\n${conteudo}\nendstream`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
  ];
  let pdf = '%PDF-1.4\n';
  const posicoes = objetos.map((o, i) => { const p = pdf.length; pdf += `${i + 1} 0 obj\n${o}\nendobj\n`; return p; });
  const xref = pdf.length;
  pdf += `xref\n0 ${objetos.length + 1}\n0000000000 65535 f \n` + posicoes.map(p => String(p).padStart(10, '0') + ' 00000 n \n').join('') +
         `trailer\n<< /Size ${objetos.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new File([Uint8Array.from(pdf, c => c.charCodeAt(0))], nome || 'Bradesco_ficticio.pdf', { type:'application/pdf' });
}

// Textos de um DDA do Bradesco fictício, no layout do PDF do banco: topo (empresa, período),
// cabeçalho da tabela, um bloco de 6 linhas por boleto e o rodapé "SAC".
// opcoes: xBenef/xValor = onde começam as colunas do beneficiário e do valor (para simular
// o PDF com colunas deslocadas); semStatus = índices dos boletos sem a linha "A PAGAR";
// valorGrudado = cabeçalho com "DestinatárioValor" numa palavra só (como alguns PDFs do banco);
// xRotuloValor = x da palavra "Valor" do cabeçalho, quando ela não fica em cima dos "R$";
// benefNaLinhaDoPagador = "Beneficiário," na mesma linha de "Pagador," (outro layout do banco).
function textosDdaBradesco(cnpjConta, boletos, opcoes){
  const { xBenef = 362.9, xValor = 540.5, semStatus = [], valorGrudado = false, xRotuloValor = xValor,
          benefNaLinhaDoPagador = false } = opcoes || {};
  const topBenef = benefNaLinhaDoPagador ? 235.8 : 241.2;
  const cabecalhoValor = valorGrudado
    ? [{ top:topBenef, x:xBenef - 7.5, texto:'Beneficiário, CPF/CNPJ e Banco DestinatárioValor' }]
    : [{ top:topBenef, x:xBenef - 7.5, texto:'Beneficiário, CPF/CNPJ e Banco Destinatário' }, { top:241.2, x:xRotuloValor, texto:'Valor' }];
  const t = [
    { top:43,    x:155.1, texto:'Boletos de Cobrança Registrados/DDA' },
    { top:58,    x:155.1, texto:'EMPRESA FICTICIA S.A | 0' + cnpjConta },
    { top:82.9,  x:155.1, texto:'Data da operação : 01/12/2026 - 09h00' },
    { top:209.8, x:50.5,  texto:'Data de Vencimento:' },
    { top:210,   x:137.8, texto:'20/11/2026 até 20/11/2026' },
    { top:235.8, x:180.7, texto:'Pagador, CPF/CNPJ e' },
    { top:239.5, x:40.3,  texto:'Data de Vencimento /' },
    ...cabecalhoValor,
    { top:246.6, x:180.7, texto:'Número de documento' },
    { top:250.3, x:40.3,  texto:'Débito e Limite de Pagamento' },
  ];
  boletos.forEach((b, k) => {
    const y = 273 + 48.2 * k;
    t.push({ top:y, x:188.2, texto:b.pagador }, { top:y, x:xBenef, texto:b.benef },
           { top:y + 7.5, x:40.3, texto:b.venc }, { top:y + 7.6, x:xValor, texto:'R$ ' + b.valor },
           { top:y + 10.8, x:188.2, texto:b.pagadorCnpj }, { top:y + 10.8, x:xBenef, texto:b.cnpj },
           { top:y + 18.3, x:40.3, texto:b.limite },
           { top:y + 21.6, x:188.2, texto:b.doc }, { top:y + 21.6, x:xBenef, texto:b.banco });
    if(!semStatus.includes(k)) t.push({ top:y + 29.2, x:40.3, texto:'A PAGAR' });
  });
  const fim = 273 + 48.2 * boletos.length + 20;
  t.push({ top:fim, x:51.9, texto:'SAC - Serviço de Alô Bradesco' }, { top:fim + 34, x:47.8, texto:'Ouvidoria 0800 000 0000' });
  return t;
}

// Desenha o placar e a lista (com textContent: o detalhe pode ter texto qualquer).
function mostraResultados(){
  const lista = document.getElementById('lista');
  resultados.forEach(r => {
    const li = document.createElement('li');
    li.className = r.passou ? 'ok' : 'falha';
    const marca = document.createElement('span');
    marca.className = 'marca'; marca.setAttribute('aria-hidden', 'true');
    marca.textContent = r.passou ? '✓' : '✗';
    const corpo = document.createElement('div');
    const grupo = document.createElement('p'); grupo.className = 'grupo-teste'; grupo.textContent = r.grupo;
    const nome = document.createElement('p'); nome.className = 'nome'; nome.textContent = r.nome;
    corpo.append(grupo, nome);
    if(r.detalhe){ const d = document.createElement('p'); d.className = 'detalhe'; d.textContent = r.detalhe; corpo.append(d); }
    li.append(marca, corpo);
    lista.append(li);
  });
  const falhas = resultados.filter(r => !r.passou).length;
  const placar = document.getElementById('placar');
  placar.className = 'placar mensagem ' + (falhas ? 'mensagem-alerta' : 'mensagem-ok');
  placar.textContent = falhas ? `✗ ${falhas} de ${resultados.length} testes falharam` : `✓ Todos os ${resultados.length} testes passaram`;
  document.title = (falhas ? '✗ ' : '✓ ') + 'Testes da Conferência';
  window.resultadoDosTestes = { total: resultados.length, falhas, resultados };
}

/* ---------------------------------------------------------------------
   TESTES — só dados fictícios
   --------------------------------------------------------------------- */
async function rodaTestes(){
  // boleto fictício: banco 341, R$ 1.234,56, vencimento 23/10/2026 (do projeto antigo)
  const ESP = { banco:'341', valor:1234.56, venc:'23/10/2026' };
  const CB = '34191160800001234561234567890123456789012345';
  const LINHA = '34191234546789012345767890123457116080000123456';

  // ---------- módulo de boleto (testes do projeto antigo) ----------
  await teste('Boleto: código válido', () => {
    const r = validaBoleto(CB, ESP);
    const d = decodifica(CB);
    confere('Código válido → linha digitável certa', r.ok && r.linha === LINHA, `linha ${r.linha}`);
    confere('Código válido → banco 341, valor R$ 1.234,56, vencimento 23/10/2026',
      d.banco === '341' && d.valor === 1234.56 && d.venc === '23/10/2026', `banco ${d.banco} · ${brl(d.valor)} · ${d.venc}`);
    confere('Linha digitável → volta para o mesmo código de barras', linhaParaBarras(LINHA) === CB && validaBoleto(LINHA, ESP).cb === CB, linhaParaBarras(LINHA));
  });

  await teste('Boleto: um dígito trocado', () => {
    const r = validaBoleto('34191234546789012345767891123457116080000123456', ESP);
    confere('Um dígito trocado na linha → bloqueado, sem linha digitável', !r.ok && r.linha === '' && r.cb === '', r.motivo);
  });

  await teste('Boleto: código vindo como número', () => {
    const r = validaBoleto('3.4191160800001234e+43', ESP);
    confere('Código "3.4191160800001234e+43" → bloqueado como "ilegível"', !r.ok && r.linha === '' && /ilegível/.test(r.motivo), r.motivo);
  });

  // ---------- módulo de boleto (outros bloqueios do mesmo código antigo) ----------
  await teste('Boleto: DVs', () => {
    confere('DV geral (módulo 11) do código fictício = 1', dvMod11Geral(CB) === 1 && CB[4] === '1', `DV ${dvMod11Geral(CB)}`);
    confere('DVs dos 3 campos (módulo 10) = 4, 7 e 7', dvMod10(LINHA.slice(0, 9)) === 4 && dvMod10(LINHA.slice(10, 20)) === 7 && dvMod10(LINHA.slice(21, 31)) === 7,
      `${dvMod10(LINHA.slice(0, 9))}, ${dvMod10(LINHA.slice(10, 20))}, ${dvMod10(LINHA.slice(21, 31))}`);
    const trocaDv = CB.slice(0, 4) + '2' + CB.slice(5);
    const r = validaEstrutura(trocaDv);
    confere('DV geral errado → bloqueado', !r.ok && /módulo 11/.test(r.motivo), r.motivo);
  });

  await teste('Boleto: comparação com o DDA', () => {
    const banco = validaBoleto(CB, { ...ESP, banco:'237' });
    confere('Banco do DDA diferente → bloqueado', !banco.ok && banco.linha === '' && /banco do código/.test(banco.motivo), banco.motivo);
    const valor = validaBoleto(CB, { ...ESP, valor:1234.57 });
    confere('Valor do DDA 1 centavo diferente → bloqueado', !valor.ok && valor.linha === '' && /valor do código/.test(valor.motivo), valor.motivo);
    const venc = validaBoleto(CB, { ...ESP, venc:'24/10/2026' });
    confere('Vencimento diferente → não bloqueia, só avisa', venc.ok && venc.avisos.length === 1, venc.avisos.join(' · '));
  });

  await teste('Boleto: o que não é boleto', () => {
    const consumo = validaEstrutura('8' + '1'.repeat(47));
    confere('48 dígitos começando com 8 → conta de consumo, sem linha', !consumo.ok && consumo.tipo === 'consumo' && consumo.linha === '', consumo.motivo);
    const curto = validaEstrutura(CB.slice(0, 43));
    confere('43 dígitos → bloqueado pelo tamanho', !curto.ok && /tem 43 dígitos/.test(curto.motivo), curto.motivo);
    const letra = validaEstrutura(CB.slice(0, 10) + 'A' + CB.slice(11));
    confere('Letra no meio do código → bloqueado', !letra.ok && /não são números/.test(letra.motivo), letra.motivo);
    const vazio = validaEstrutura('');
    confere('Sem código → bloqueado', !vazio.ok && /sem código/.test(vazio.motivo), vazio.motivo);
  });

  await teste('Boleto: formato impresso', () => {
    confere('Linha formatada com pontos e espaços, sem mudar nenhum dígito',
      formataLinha(LINHA) === '34191.23454 67890.123457 67890.123457 1 16080000123456' && apenasDigitos(formataLinha(LINHA)) === LINHA, formataLinha(LINHA));
  });

  // ---------- leitura do Excel: código como texto ----------
  await teste('Leitura: código de barras no Excel', async () => {
    const arq = excelFicticio([['Código de barras'], [CB], [null]], { A3: { t:'n', v:Number(CB) } });
    const leitura = await lerMatrizComTexto(arq);
    const texto = codigoBarrasDaCelula(leitura, 1, 0);
    confere('Código gravado como texto → os 44 dígitos iguais, não suspeito', !texto.suspeito && texto.digitos === CB && validaBoleto(leitura.textoDe(1, 0).texto, ESP).ok, texto.digitos);
    const numero = codigoBarrasDaCelula(leitura, 2, 0);
    const v = validaEstrutura(leitura.textoDe(2, 0).texto);
    confere('Código gravado como número → suspeito e bloqueado (nunca vira os 44 dígitos certos)',
      numero.suspeito && numero.digitos !== CB && !v.ok, `texto lido "${leitura.textoDe(2, 0).texto}" · ${v.motivo}`);
    confere('Número da linha no Excel = 3 para a 3ª linha', leitura.linhaExcel(2) === 3, `linha ${leitura.linhaExcel(2)}`);
  });

  // ---------- identificaEmpresa (1ª linha fictícia de cada formato) ----------
  await teste('Empresa: tudo em A1', () => {
    const linha = (texto) => [[texto, null, null], ['outra linha']];
    const casos = [
      ['1 CRV INDUSTRIAL LTDA                    Empresa(s): 1 / 5 /   Data/Hora : 01/01/26 08:00:00', 'crv-matriz'],
      ['5 CRV INDUSTRIAL LTDA                    Empresa(s): 1 / 5 /   Data/Hora : 01/01/26 08:00:00', 'crv-filial'],
      ['1 RUBIATABA INDUSTRIAL S A               Empresa(s): 1 /   Data/Hora : 01/01/26 08:00:00', 'rubi-matriz'],
      ['4 RUBIATABA INDUSTRIAL S A               Empresa(s): 1 / 4 /   Data/Hora : 01/01/26 08:00:00', 'rubi-filial'],
    ];
    casos.forEach(([texto, id]) => {
      const e = identificaEmpresa(linha(texto));
      confere(`"${texto.slice(0, 26).trim()} …" → ${id}`, e && e.id === id, e ? `${e.nome} · ${e.cnpj}` : 'null');
    });
  });

  await teste('Empresa: número em A1 e nome em B1', async () => {
    const e = identificaEmpresa([[5, 'CRV INDUSTRIAL LTDA                 ', 'Data/Hora :', 46000, '08:00:00']]);
    confere('A1 = 5 (número), B1 = "CRV INDUSTRIAL LTDA" → CRV Filial', e && e.id === 'crv-filial', e ? e.nome : 'null');
    const arq = excelFicticio([[1, 'Rubiatába Industrial S A', 'Data/Hora :'], ['outra linha']]);
    const lido = identificaEmpresa((await lerMatrizComTexto(arq)).matriz);

    const c = (l, a, b) => l.slice(a - 1, b);
    confere('G 1-17: 341, lote 0001, registro 3, sequencial 00001, G, espaço, movimento 01',
      c(g1, 1, 17) === '341' + '0001' + '3' + '00001' + 'G' + ' ' + '01' && c(h1, 9, 14) === '00002H' && c(g2, 9, 14) === '00003G', c(g1, 1, 17));
    confere('G 18-61 = o código de barras exatamente como veio do DDA', c(g1, 18, 61) === b1.codigoTexto && c(g2, 18, 61) === b2.codigoTexto);
    confere('G 62-77: CNPJ → "2" + 15 dígitos; CPF → "1" + 15 dígitos',
      c(g1, 62, 77) === '2' + '011222333000181' && c(g2, 62, 77) === '1' + '000012345678909', `${c(g1, 62, 77)} · ${c(g2, 62, 77)}`);
    confere('G 78-107 nome: sem acento, maiúsculo, pontuação vira espaço, 30 posições',
      c(g1, 78, 107) === 'ACAO   CIA  FICTICIA PECAS LTD', `"${c(g1, 78, 107)}"`);
    confere('G 108-130: vencimento DDMMAAAA e "Até Venc." em centavos (15)',
      c(g1, 108, 130) === '20112026' + '000000000123456' && c(g2, 108, 130) === '19112026' + '000000000009990', c(g1, 108, 130));
    confere('G 148-157 Nº Doc.: a pontuação fica ("88790/1"); "0" vira vazio; maiúsculo e cortado em 10',
      c(g1, 148, 157) === '88790/1   ' && c(g2, 148, 157) === ' '.repeat(10) && c(L[6], 148, 157) === 'NF 0000295', `"${c(g1, 148, 157)}" "${c(g2, 148, 157)}" "${c(L[6], 148, 157)}"`);
    confere('G 131-147 e 158-240 com os valores fixos do layout',
      c(g1, 131, 147) === '00' + '000000000000009' && c(g1, 158, 240) === '     ' + '000000' + ' '.repeat(9) + ' 102' + '0'.repeat(11) +
      '00' + '0' + '0'.repeat(8) + '0 00000000000000' + '0'.repeat(11) + '0'.repeat(10));
    const hEsperado = '341' + '0001' + '3' + '00004' + 'H' + ' ' + '01' + '0' + '0'.repeat(15) + ' '.repeat(40) + ' ' + '0'.repeat(23) + ' ' + '0'.repeat(23) +
      '0' + '0'.repeat(23) + '0'.repeat(15) + ' '.repeat(80);
    confere('H do boleto COM desconto ("A Pagar" menor): 18 "0", 19-33 zeros, 34-73 espaços (nem desconto nem sacador)', h2 === hEsperado, h2.slice(0, 80));
    confere('H de todos os boletos iguais, só muda o sequencial', L.filter(l => l[13] === 'H').every(h => h.slice(0, 8) + h.slice(13) === hEsperado.slice(0, 8) + hEsperado.slice(13)));

    const hm = new TextDecoder('latin1').decode(modeloRetFicticio([crvMatriz, crvFilial])).split('\r\n')[0];
    confere('Header de arquivo = o do modelo, trocando só 144-151 data, 152-157 hora e 158-163 NSA',
      L[0].slice(0, 143) === hm.slice(0, 143) && L[0].slice(163) === hm.slice(163) && c(L[0], 144, 163) === '25112026' + '143005' + '900001', c(L[0], 144, 163));
    const loteFilial = modelo.lotes.find(l => l.cnpj === cnpjDaEmpresaNoRet(crvFilial)).linha;
    confere('Header de lote = o do modelo da empresa escolhida (filial, que no modelo é o lote 0002), com 4-7 = "0001"',
      L[1] === loteFilial.slice(0, 3) + '0001' + loteFilial.slice(7) && c(loteFilial, 4, 7) === '0002');
    confere('Trailer de lote: 8 registros (2×3+2) e a soma em centavos (1.344,46)',
      L[8] === '341' + '0001' + '5' + ' '.repeat(9) + '000008' + '000000000000134446' + '0'.repeat(18) + ' '.repeat(181), c(L[8], 18, 41));
    confere('Trailer de arquivo: lote 000001 e 10 linhas', L[9] === '341' + '9999' + '9' + ' '.repeat(9) + '000001' + '000010' + ' '.repeat(211), c(L[9], 18, 29));
    confere('Nome do arquivo: DDA_FILIAL_<menor vencimento>_TESTE.RET', t.nomeArquivo === 'DDA_FILIAL_19112026_TESTE.RET', t.nomeArquivo);

    const comp = gera({ teste:false });
    confere('Completo → os 4 aprovados (8 detalhes), 12 linhas, trailer de lote com 10 registros, nome COMPLETO',
      comp.qtdBoletos === 4 && comp.linhas.length === 12 && c(comp.linhas[10], 18, 23) === '000010' && /_COMPLETO\.RET$/.test(comp.nomeArquivo), comp.nomeArquivo);
    const daMatriz = gera({ empresa: crvMatriz });
    confere('Empresa matriz → header de lote da matriz e nome DDA_MATRIZ_...', daMatriz.linhas[1].slice(18, 33) === cnpjDaEmpresaNoRet(crvMatriz) && /^DDA_MATRIZ_/.test(daMatriz.nomeArquivo));

    const semContagem = gera({ leitura:{ contagem:{ ok:false } } });
    confere('Contagem que não fecha → geração BLOQUEADA, mesmo com boletos aprovados', !!semContagem.bloqueio && !semContagem.texto && /contagem/.test(semContagem.bloqueio), semContagem.bloqueio);
    const nenhum = gera({ travas: travasDdaRet([ruim]) });
    confere('Nenhum boleto aprovado nas travas → geração BLOQUEADA', !!nenhum.bloqueio && /Nenhum boleto passou/.test(nenhum.bloqueio), nenhum.bloqueio);
    const nsaGrande = gera({ nsa: 1234567 });
    confere('NSA que não cabe em 6 posições → bloqueado (nada é cortado)', !!nsaGrande.bloqueio && !nsaGrande.texto, nsaGrande.bloqueio);
    const copia = JSON.stringify([b1, b2, b3]);
    gera({ teste:false });
    confere('Gerar não muda nada dos boletos', JSON.stringify([b1, b2, b3]) === copia);
  });

  await teste('DDA → .RET: NSA', async () => {
    const vazio = controleNsaVazio();
    confere('Sem NSA usado → sugere 900001', proximoNsa(vazio) === 900001);
    const usados = { versao:1, usados:[900001, 900005] };
    confere('Com 900001 e 900005 usados → sugere 900006', proximoNsa(usados) === 900006);
    confere('NSA bom → aceito', checaNsa('900002', usados).ok && checaNsa(' 900006 ', usados).nsa === 900006);
    confere('NSA já usado → recusado, com a sugestão', !checaNsa('900005', usados).ok && /já foi usado.*900006/.test(checaNsa('900005', usados).motivo), checaNsa('900005', usados).motivo);
    confere('NSA abaixo de 900001 (pode bater com os do banco) → recusado', !checaNsa('000741', usados).ok && /a partir de 900001/.test(checaNsa('741', usados).motivo));
    confere('NSA com letra, vazio ou com 7 dígitos → recusado', !checaNsa('90000A', usados).ok && !checaNsa('', usados).ok && !checaNsa('9000001', usados).ok);
    const guardado = localStorage.getItem(CHAVE_CONTROLE_NSA);
    try{
      localStorage.removeItem(CHAVE_CONTROLE_NSA);
      await gravarNsaUsado(900003);
      const c = await gravarNsaUsado(900001);
      const lido = await lerControleNsa();
      confere('Gravar NSA usado e ler de volta → a lista em ordem, sem repetir', JSON.stringify(lido) === JSON.stringify(c) && lido.usados.join() === '900001,900003' &&
        (await gravarNsaUsado(900003)).usados.length === 2, JSON.stringify(lido));
      localStorage.setItem(CHAVE_CONTROLE_NSA, '{estragado');
      confere('Controle estragado → começa vazio', (await lerControleNsa()).usados.length === 0);
    } finally {
      if(guardado === null) localStorage.removeItem(CHAVE_CONTROLE_NSA); else localStorage.setItem(CHAVE_CONTROLE_NSA, guardado);
    }
  });

  await teste('DDA → .RET: SHA-256', async () => {
    const abc = await sha256Hex(new TextEncoder().encode('abc'));
    confere('SHA-256 de "abc" = o valor do padrão (FIPS 180-2)', abc === 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad', abc);
    confere('Um byte diferente → outro SHA-256', (await sha256Hex(new TextEncoder().encode('abd'))) !== abc);
    let recusou = false;
    try{ bytesAsciiDoTexto('AÇÃO'); }catch(e){ recusou = true; }
    confere('Texto com acento não vira bytes do .RET (erro em vez de trocar o caractere)', recusou && bytesAsciiDoTexto('A1 ').join() === '65,49,32');
  });

  // mesmo arquivo fictício do teste de geração: 4 boletos aprovados (b1..b4) e 1 reprovado
  const cenarioRetFicticio = () => {
    const b1 = { ...boletoFicticio({ beneficiario:'ALFA FICTICIA LTDA', doc:'88790/1', valor:1234.56, venc:'20/11/2026' }), cnpj:'11.222.333/0001-81' };
    const b2 = { ...boletoFicticio({ beneficiario:'BETA FICTICIA ME', doc:'0', valor:99.90, venc:'19/11/2026', banco:'237', valorAPagar:50.00 }), cnpj:'123.456.789-09' };
    const b3 = { ...boletoFicticio({ beneficiario:'GAMA FICTICIA', doc:'NF 2951', valor:10.00 }), cnpj:'11.222.333/0001-81' };
    const b4 = { ...boletoFicticio({ beneficiario:'DELTA FICTICIA', doc:'4', valor:20.00 }), cnpj:'11.222.333/0001-81' };
    const ruim = { ...boletoFicticio({ beneficiario:'FORA FICTICIA', doc:'5', valor:30.00 }), cnpj:'11.222.333/0001-82' };
    const todos = [b1, ruim, b2, b3, b4];
    const modelo = leModeloRet(modeloRetFicticio([crvMatriz, crvFilial]));
    const travas = travasDdaRet(todos);
    const leitura = { contagem:{ ok:true }, boletos: todos, total: somaAteVenc(todos) };
    const agora = new Date(2026, 10, 25, 14, 30, 5);
    const gera = teste => geraRet({ modelo, empresa: crvFilial, leitura, travas, nsa: 900001, agora, teste });
    return { b1, b2, b3, b4, ruim, todos, modelo, travas, leitura, agora, gera };
  };
  // troca o texto de uma linha (índice de 0) a partir da posição (de 1) e devolve os bytes
  const editaRet = (texto, linha, pos, novo) => {
    const L = texto.split('\r\n');
    L[linha] = L[linha].slice(0, pos - 1) + novo + L[linha].slice(pos - 1 + novo.length);
    return textoParaBytes(L.join('\r\n'));
  };
  const outroDigito = d => String((Number(d) + 1) % 10);

  await teste('DDA → .RET: releitura do arquivo antes do download', async () => {
    const c = cenarioRetFicticio();
    const t = c.gera(true);
    const bytes = bytesAsciiDoTexto(t.texto);
    const ctx = { modelo: c.modelo, empresa: crvFilial, nsa: 900001, boletos: t.boletos };
    const p = provaRetGerado(bytes, ctx);
    const falhas = r => r.itens.filter(i => !i.ok).map(i => i.titulo + ': ' + i.itens.join(' / ')).join(' | ');
    confere('Arquivo gerado com 3 boletos → releitura OK, 5 itens verdes, 3 boletos e a soma certa (1.344,46)',
      p.ok && p.itens.length === 5 && p.qtd === 3 && p.total === 1344.46, falhas(p) || `${p.qtd} · ${p.total}`);
    const bloqueia = (b, titulo, x = ctx) => { const r = provaRetGerado(b, x); return !r.ok && r.itens.some(i => !i.ok && i.titulo === titulo); };

    const g = t.linhas[2], pos = 18 + 30;
    confere('Um dígito do código de barras trocado → download bloqueado (travas e DDA)',
      bloqueia(editaRet(t.texto, 2, pos, outroDigito(g[pos - 1])), 'Travas de cada código') &&
      bloqueia(editaRet(t.texto, 2, pos, outroDigito(g[pos - 1])), 'Cada boleto igual ao DDA'));
    const valorNovo = editaRet(t.texto, 2, 130, outroDigito(g[129]));
    confere('Valor do G trocado → bloqueado (valor do código ≠ arquivo, soma do trailer, DDA)',
      bloqueia(valorNovo, 'Travas de cada código') && bloqueia(valorNovo, 'Estrutura do arquivo') && bloqueia(valorNovo, 'Cada boleto igual ao DDA'));
    confere('Vencimento do G trocado → bloqueado (diferente do DDA)', bloqueia(editaRet(t.texto, 2, 108, '21'), 'Cada boleto igual ao DDA'));
    confere('CNPJ do beneficiário trocado → bloqueado (DV e DDA)', bloqueia(editaRet(t.texto, 2, 77, outroDigito(g[76])), 'Travas de cada código'));
    confere('Linha com 239 caracteres → bloqueado', bloqueia(textoParaBytes(t.texto.replace(/ \r\n/, '\r\n')), 'Estrutura do arquivo'));
    confere('LF no lugar de CRLF → bloqueado', bloqueia(textoParaBytes(t.texto.replace(/\r\n/g, '\n')), 'Estrutura do arquivo'));
    confere('Última linha sem CRLF → bloqueado', bloqueia(textoParaBytes(t.texto.slice(0, -2)), 'Estrutura do arquivo'));
    const semH = t.linhas.filter((l, i) => i !== 3);
    confere('Um H a menos → bloqueado (G sem H e trailers)', bloqueia(textoParaBytes(semH.join('\r\n') + '\r\n'), 'Estrutura do arquivo'));
    confere('Sequencial do H trocado → bloqueado', bloqueia(editaRet(t.texto, 3, 9, '00009'), 'Estrutura do arquivo'));
    confere('Trailer de arquivo com outra quantidade de linhas → bloqueado', bloqueia(editaRet(t.texto, 9, 24, '000011'), 'Estrutura do arquivo'));
    confere('NSA diferente do escolhido → bloqueado', bloqueia(bytes, 'Empresa, headers e NSA', { ...ctx, nsa: 900002 }));
    confere('Empresa diferente da do lote → bloqueado', bloqueia(bytes, 'Empresa, headers e NSA', { ...ctx, empresa: crvMatriz }));
    confere('Boletos fora da ordem do DDA → bloqueado', bloqueia(bytes, 'Cada boleto igual ao DDA', { ...ctx, boletos: [c.b2, c.b1, c.b3] }));
    confere('Um boleto a mais no DDA esperado → bloqueado', bloqueia(bytes, 'Cada boleto igual ao DDA', { ...ctx, boletos: [c.b1, c.b2, c.b3, c.b4] }));
    confere('H com sacador/avalista → bloqueado (o site nunca grava sacador)', bloqueia(editaRet(t.texto, 3, 18, '2011222333000181'), 'Sem desconto nem sacador'));
  });

  await teste('DDA → .RET: "Verificar um .RET"', async () => {
    const c = cenarioRetFicticio();
    const t = c.gera(false);
    const bytes = bytesAsciiDoTexto(t.texto);
    const v = verificaRet(bytes, null);
    confere('.RET gerado (4 boletos), sem DDA → nenhum erro', v.ok && v.qtd === 4 && v.total === 1364.46 && !v.comparou,
      v.itens.filter(i => i.tipo === 'alerta').map(i => i.titulo).join(', '));
    const g = t.linhas[2];
    const dig = verificaRet(editaRet(t.texto, 2, 48, outroDigito(g[47])), null);
    confere('.RET editado (um dígito do código) → acusa nas travas', !dig.ok && !dig.boletos[0].travas.ok && /módulo 11/.test(dig.boletos[0].travas.motivos.join()), dig.boletos[0].travas.motivos.join());
    const val = verificaRet(editaRet(t.texto, 2, 130, outroDigito(g[129])), null);
    confere('.RET editado (valor) → acusa (valor do código e soma do trailer)', !val.ok && !val.boletos[0].travas.ok && val.itens[0].tipo === 'alerta');

    const ddaOk = { boletos: c.todos, empresaCnpj: '' };
    const comDda = verificaRet(bytes, ddaOk);
    confere('Com o DDA de origem → cada boleto igual, e o reprovado aparece como "não está no .RET"',
      comDda.ok && comDda.comparou && comDda.semNoRet.length === 1 && comDda.semNoRet[0] === c.ruim);
    const outroValor = verificaRet(bytes, { boletos: [{ ...c.b1, valor: 1234.57 }, c.b2, c.b3, c.b4], empresaCnpj: '' });
    confere('DDA com outro valor → "diferente do DDA"', !outroValor.ok && outroValor.itens.some(i => i.titulo === 'Cada boleto igual ao DDA' && /valor/.test(i.itens.join())));
    const falta = verificaRet(bytes, { boletos: [c.b1, c.b3, c.b4], empresaCnpj: '' });
    confere('Boleto do .RET que não está no DDA → acusa', !falta.ok && falta.itens.some(i => /não está no DDA/.test(i.itens.join())));
    const daMatriz = verificaRet(bytes, { boletos: c.todos, empresaCnpj: apenasDigitos(crvMatriz.cnpj) });
    confere('Excel do DDA de outra empresa → acusa', !daMatriz.ok && daMatriz.itens.some(i => i.titulo === 'DDA de outra empresa'));

    // sacador/avalista: H 18 = "2", 19-33 CNPJ, 34-73 nome (só o .RET do banco traz)
    const outro = verificaRet(editaRet(t.texto, 3, 18, '2' + '012345678000195' + 'SACADOR FICTICIO SA'), null);
    const sac = outro.itens.find(i => /Sacador/.test(i.titulo));
    confere('H 18 = "2" com CNPJ diferente do beneficiário → alerta de sacador/avalista (amarelo, não bloqueia)',
      outro.ok && sac.tipo === 'aviso' && /12\.345\.678\/0001-95/.test(outro.boletos[0].alertaSacador) && !outro.boletos[1].alertaSacador, sac && sac.titulo);
    const mesmo = verificaRet(editaRet(t.texto, 3, 18, '2' + '011222333000181' + 'ALFA FICTICIA LTDA'), null);
    confere('Sacador com o MESMO CNPJ do beneficiário → sem alerta', mesmo.ok && !mesmo.boletos[0].alertaSacador && mesmo.itens.find(i => /Sacador/.test(i.titulo)).tipo === 'ok');

    const dois = verificaRet(modeloRetFicticio([crvMatriz, crvFilial]), null);
    confere('.RET com 2 lotes (como o do banco) → lê os 2 lotes; trailers vazios acusam', dois.lotes.length === 2 && !dois.ok && dois.itens[0].itens.some(e => /trailer do lote 0001 diz/.test(e)), dois.itens[0].itens.slice(0, 2).join(' / '));
    const pdfDois = verificaRet(modeloRetFicticio([crvMatriz, crvFilial]), { boletos: [], empresaCnpj: '' });
    confere('PDF (sem CNPJ) com .RET de 2 lotes → comparação não feita, com o motivo', !pdfDois.comparou && pdfDois.itens.some(i => i.titulo === 'Comparação com o DDA não feita'));
  });

  await teste('DDA → .RET: Excel de conferência', async () => {
    const c = cenarioRetFicticio();
    const t = c.gera(true);
    const alertas = alertasDdaRet(c.travas.noArquivo, memoriaVazia());
    const abas = abasExcelRet({ gerado: t, travas: c.travas, alertas, empresa: crvFilial, nsa: 900001, agora: c.agora,
      shaRet: 'a'.repeat(64), dda: { nome:'dda-ficticio.xlsx', sha256: 'b'.repeat(64) }, leitura: c.leitura });
    confere('4 abas: Boletos no arquivo, Fora do arquivo, Atenção, Controle', abas.map(a => a.nome).join('|') === 'Boletos no arquivo|Fora do arquivo|Atenção|Controle');
    const r = await excelRetConferido(abas);
    confere('Excel lido de volta: todas as células de texto iguais', !!r.conteudo && !r.erros, (r.erros || []).join(' / '));
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(r.conteudo);
    const ws = wb.getWorksheet('Boletos no arquivo');
    const cod = ws.getRow(3).getCell(7), linha = ws.getRow(3).getCell(8);
    confere('Código de barras e linha digitável como TEXTO (numFmt "@"), iguais ao DDA',
      cod.value === c.b1.codigoTexto && cod.numFmt === '@' && linha.value === barrasParaLinha(c.b1.codigoTexto) && linha.numFmt === '@', `${typeof cod.value} ${cod.numFmt}`);
    confere('Total na última linha (3 boletos, R$ 1.344,46)', ws.getRow(6).getCell(6).value === 1344.46 && /3 boleto/.test(ws.getRow(6).getCell(2).value));
    const fora = wb.getWorksheet('Fora do arquivo').getRow(3);
    confere('"Fora do arquivo" com o reprovado e o motivo', fora.getCell(2).value === 'FORA FICTICIA' && /dígito verificador/.test(fora.getCell(7).value), fora.getCell(7).value);
    const at = wb.getWorksheet('Atenção');
    confere('"Atenção" com o desconto do boleto que está no arquivo', at.getRow(3).getCell(1).value === 'Desconto ou abatimento' && at.getRow(3).getCell(3).value === 'BETA FICTICIA ME');
    const ctl = wb.getWorksheet('Controle');
    const valor = rot => { for(let i = 3; i <= ctl.rowCount; i++) if(ctl.getRow(i).getCell(1).value === rot) return ctl.getRow(i).getCell(2).value; return null; };
    confere('"Controle" com NSA, quantidade, total e os dois SHA-256', valor('NSA') === '900001' && valor('Quantidade de boletos') === '3' &&
      valor('SHA-256 do .RET') === 'a'.repeat(64) && valor('SHA-256 do DDA de origem') === 'b'.repeat(64) && valor('Data/hora da geração') === '25/11/2026 14:30:05');
  });

  mostraResultados();
}

rodaTestes().catch(err => {
  const placar = document.getElementById('placar');
  placar.className = 'placar mensagem mensagem-alerta';
  placar.textContent = 'Os testes não rodaram: ' + (err && err.message || err);
  window.resultadoDosTestes = { total: 0, falhas: 1, erro: String(err) };
});
</script>
