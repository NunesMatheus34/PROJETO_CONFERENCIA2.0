<script>
/* ---------------------------------------------------------------------
   Pequeno executor: cada teste() agrupa várias conferências (confere).
   Um erro dentro do teste vira um resultado vermelho, sem parar os outros.
   --------------------------------------------------------------------- */
const resultados = [];
let grupoAtual = '';

// Guarda um resultado: nome do que foi conferido, se passou e um detalhe para quem lê.
function confere(nome, passou, detalhe){
  resultados.push({ grupo: grupoAtual, nome, passou: !!passou, detalhe: detalhe || '' });
}

// Roda um grupo de conferências; erro inesperado conta como falha.
async function teste(nome, fn){
  grupoAtual = nome;
  try{ await fn(); }catch(err){ confere(nome, false, 'erro: ' + (err && err.message || err)); }
}

// Monta um Excel fictício (SheetJS) com as linhas dadas e devolve como File,
// como se o usuário tivesse escolhido o arquivo. celulas: { 'A2': {t:'n', v:...} } troca células.
function excelFicticio(linhas, celulas){
  const aba = XLSX.utils.aoa_to_sheet(linhas);
  Object.assign(aba, celulas || {});
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, aba, 'Planilha1');
  const bytes = XLSX.write(wb, { type:'array', bookType:'xlsx' });
  return new File([bytes], 'ficticio.xlsx');
}

// Monta um PDF fictício de 1 página (texto em Helvetica) e devolve como File.
// textos = [{ top, x, texto }]: top e x em pontos, contando do canto de cima à esquerda,
// como no PDF do banco. Só letras do Latin-1 (ç, á, é, ô...).
function pdfFicticio(textos, nome){
  const L = 623.63, A = 963.79, TAM = 8.29;
  const escapa = t => t.replace(/[\\()]/g, c => '\\' + c);
  const conteudo = textos.map(({ top, x, texto }) =>
    `BT /F1 ${TAM} Tf 1 0 0 1 ${x.toFixed(2)} ${(A - top - TAM * 0.793).toFixed(2)} Tm (${escapa(texto)}) Tj ET`).join('\n');
  const objetos = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${L} ${A}] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>`,
    `<< /Length ${conteudo.length} >>\nstream\n${conteudo}\nendstream`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
  ];
  let pdf = '%PDF-1.4\n';
  const posicoes = objetos.map((o, i) => { const p = pdf.length; pdf += `${i + 1} 0 obj\n${o}\nendobj\n`; return p; });
  const xref = pdf.length;
  pdf += `xref\n0 ${objetos.length + 1}\n0000000000 65535 f \n` + posicoes.map(p => String(p).padStart(10, '0') + ' 00000 n \n').join('') +
         `trailer\n<< /Size ${objetos.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new File([Uint8Array.from(pdf, c => c.charCodeAt(0))], nome || 'Bradesco_ficticio.pdf', { type:'application/pdf' });
}

// Textos de um DDA do Bradesco fictício, no layout do PDF do banco: topo (empresa, período),
// cabeçalho da tabela, um bloco de 6 linhas por boleto e o rodapé "SAC".
// opcoes: xBenef/xValor = onde começam as colunas do beneficiário e do valor (para simular
// o PDF com colunas deslocadas); semStatus = índices dos boletos sem a linha "A PAGAR".
function textosDdaBradesco(cnpjConta, boletos, opcoes){
  const { xBenef = 362.9, xValor = 540.5, semStatus = [] } = opcoes || {};
  const t = [
    { top:43,    x:155.1, texto:'Boletos de Cobrança Registrados/DDA' },
    { top:58,    x:155.1, texto:'EMPRESA FICTICIA S.A | 0' + cnpjConta },
    { top:82.9,  x:155.1, texto:'Data da operação : 01/12/2026 - 09h00' },
    { top:209.8, x:50.5,  texto:'Data de Vencimento:' },
    { top:210,   x:137.8, texto:'20/11/2026 até 20/11/2026' },
    { top:235.8, x:180.7, texto:'Pagador, CPF/CNPJ e' },
    { top:239.5, x:40.3,  texto:'Data de Vencimento /' },
    { top:241.2, x:xBenef - 7.5, texto:'Beneficiário, CPF/CNPJ e Banco Destinatário' },
    { top:241.2, x:xValor, texto:'Valor' },
    { top:246.6, x:180.7, texto:'Número de documento' },
    { top:250.3, x:40.3,  texto:'Débito e Limite de Pagamento' },
  ];
  boletos.forEach((b, k) => {
    const y = 273 + 48.2 * k;
    t.push({ top:y, x:188.2, texto:b.pagador }, { top:y, x:xBenef, texto:b.benef },
           { top:y + 7.5, x:40.3, texto:b.venc }, { top:y + 7.6, x:xValor, texto:'R$ ' + b.valor },
           { top:y + 10.8, x:188.2, texto:b.pagadorCnpj }, { top:y + 10.8, x:xBenef, texto:b.cnpj },
           { top:y + 18.3, x:40.3, texto:b.limite },
           { top:y + 21.6, x:188.2, texto:b.doc }, { top:y + 21.6, x:xBenef, texto:b.banco });
    if(!semStatus.includes(k)) t.push({ top:y + 29.2, x:40.3, texto:'A PAGAR' });
  });
  const fim = 273 + 48.2 * boletos.length + 20;
  t.push({ top:fim, x:51.9, texto:'SAC - Serviço de Alô Bradesco' }, { top:fim + 34, x:47.8, texto:'Ouvidoria 0800 000 0000' });
  return t;
}

// Desenha o placar e a lista (com textContent: o detalhe pode ter texto qualquer).
function mostraResultados(){
  const lista = document.getElementById('lista');
  resultados.forEach(r => {
    const li = document.createElement('li');
    li.className = r.passou ? 'ok' : 'falha';
    const marca = document.createElement('span');
    marca.className = 'marca'; marca.setAttribute('aria-hidden', 'true');
    marca.textContent = r.passou ? '✓' : '✗';
    const corpo = document.createElement('div');
    const grupo = document.createElement('p'); grupo.className = 'grupo-teste'; grupo.textContent = r.grupo;
    const nome = document.createElement('p'); nome.className = 'nome'; nome.textContent = r.nome;
    corpo.append(grupo, nome);
    if(r.detalhe){ const d = document.createElement('p'); d.className = 'detalhe'; d.textContent = r.detalhe; corpo.append(d); }
    li.append(marca, corpo);
    lista.append(li);
  });
  const falhas = resultados.filter(r => !r.passou).length;
  const placar = document.getElementById('placar');
  placar.className = 'placar mensagem ' + (falhas ? 'mensagem-alerta' : 'mensagem-ok');
  placar.textContent = falhas ? `✗ ${falhas} de ${resultados.length} testes falharam` : `✓ Todos os ${resultados.length} testes passaram`;
  document.title = (falhas ? '✗ ' : '✓ ') + 'Testes da Conferência';
  window.resultadoDosTestes = { total: resultados.length, falhas, resultados };
}

/* ---------------------------------------------------------------------
   TESTES — só dados fictícios
   --------------------------------------------------------------------- */
async function rodaTestes(){
  // boleto fictício: banco 341, R$ 1.234,56, vencimento 23/10/2026 (do projeto antigo)
  const ESP = { banco:'341', valor:1234.56, venc:'23/10/2026' };
  const CB = '34191160800001234561234567890123456789012345';
  const LINHA = '34191234546789012345767890123457116080000123456';

  // ---------- módulo de boleto (testes do projeto antigo) ----------
  await teste('Boleto: código válido', () => {
    const r = validaBoleto(CB, ESP);
    const d = decodifica(CB);
    confere('Código válido → linha digitável certa', r.ok && r.linha === LINHA, `linha ${r.linha}`);
    confere('Código válido → banco 341, valor R$ 1.234,56, vencimento 23/10/2026',
      d.banco === '341' && d.valor === 1234.56 && d.venc === '23/10/2026', `banco ${d.banco} · ${brl(d.valor)} · ${d.venc}`);
    confere('Linha digitável → volta para o mesmo código de barras', linhaParaBarras(LINHA) === CB && validaBoleto(LINHA, ESP).cb === CB, linhaParaBarras(LINHA));
  });

  await teste('Boleto: um dígito trocado', () => {
    const r = validaBoleto('34191234546789012345767891123457116080000123456', ESP);
    confere('Um dígito trocado na linha → bloqueado, sem linha digitável', !r.ok && r.linha === '' && r.cb === '', r.motivo);
  });

  await teste('Boleto: código vindo como número', () => {
    const r = validaBoleto('3.4191160800001234e+43', ESP);
    confere('Código "3.4191160800001234e+43" → bloqueado como "ilegível"', !r.ok && r.linha === '' && /ilegível/.test(r.motivo), r.motivo);
  });

  // ---------- módulo de boleto (outros bloqueios do mesmo código antigo) ----------
  await teste('Boleto: DVs', () => {
    confere('DV geral (módulo 11) do código fictício = 1', dvMod11Geral(CB) === 1 && CB[4] === '1', `DV ${dvMod11Geral(CB)}`);
    confere('DVs dos 3 campos (módulo 10) = 4, 7 e 7', dvMod10(LINHA.slice(0, 9)) === 4 && dvMod10(LINHA.slice(10, 20)) === 7 && dvMod10(LINHA.slice(21, 31)) === 7,
      `${dvMod10(LINHA.slice(0, 9))}, ${dvMod10(LINHA.slice(10, 20))}, ${dvMod10(LINHA.slice(21, 31))}`);
    const trocaDv = CB.slice(0, 4) + '2' + CB.slice(5);
    const r = validaEstrutura(trocaDv);
    confere('DV geral errado → bloqueado', !r.ok && /módulo 11/.test(r.motivo), r.motivo);
  });

  await teste('Boleto: comparação com o DDA', () => {
    const banco = validaBoleto(CB, { ...ESP, banco:'237' });
    confere('Banco do DDA diferente → bloqueado', !banco.ok && banco.linha === '' && /banco do código/.test(banco.motivo), banco.motivo);
    const valor = validaBoleto(CB, { ...ESP, valor:1234.57 });
    confere('Valor do DDA 1 centavo diferente → bloqueado', !valor.ok && valor.linha === '' && /valor do código/.test(valor.motivo), valor.motivo);
    const venc = validaBoleto(CB, { ...ESP, venc:'24/10/2026' });
    confere('Vencimento diferente → não bloqueia, só avisa', venc.ok && venc.avisos.length === 1, venc.avisos.join(' · '));
  });

  await teste('Boleto: o que não é boleto', () => {
    const consumo = validaEstrutura('8' + '1'.repeat(47));
    confere('48 dígitos começando com 8 → conta de consumo, sem linha', !consumo.ok && consumo.tipo === 'consumo' && consumo.linha === '', consumo.motivo);
    const curto = validaEstrutura(CB.slice(0, 43));
    confere('43 dígitos → bloqueado pelo tamanho', !curto.ok && /tem 43 dígitos/.test(curto.motivo), curto.motivo);
    const letra = validaEstrutura(CB.slice(0, 10) + 'A' + CB.slice(11));
    confere('Letra no meio do código → bloqueado', !letra.ok && /não são números/.test(letra.motivo), letra.motivo);
    const vazio = validaEstrutura('');
    confere('Sem código → bloqueado', !vazio.ok && /sem código/.test(vazio.motivo), vazio.motivo);
  });

  await teste('Boleto: formato impresso', () => {
    confere('Linha formatada com pontos e espaços, sem mudar nenhum dígito',
      formataLinha(LINHA) === '34191.23454 67890.123457 67890.123457 1 16080000123456' && apenasDigitos(formataLinha(LINHA)) === LINHA, formataLinha(LINHA));
  });

  // ---------- leitura do Excel: código como texto ----------
  await teste('Leitura: código de barras no Excel', async () => {
    const arq = excelFicticio([['Código de barras'], [CB], [null]], { A3: { t:'n', v:Number(CB) } });
    const leitura = await lerMatrizComTexto(arq);
    const texto = codigoBarrasDaCelula(leitura, 1, 0);
    confere('Código gravado como texto → os 44 dígitos iguais, não suspeito', !texto.suspeito && texto.digitos === CB && validaBoleto(leitura.textoDe(1, 0).texto, ESP).ok, texto.digitos);
    const numero = codigoBarrasDaCelula(leitura, 2, 0);
    const v = validaEstrutura(leitura.textoDe(2, 0).texto);
    confere('Código gravado como número → suspeito e bloqueado (nunca vira os 44 dígitos certos)',
      numero.suspeito && numero.digitos !== CB && !v.ok, `texto lido "${leitura.textoDe(2, 0).texto}" · ${v.motivo}`);
    confere('Número da linha no Excel = 3 para a 3ª linha', leitura.linhaExcel(2) === 3, `linha ${leitura.linhaExcel(2)}`);
  });

  // ---------- identificaEmpresa (1ª linha fictícia de cada formato) ----------
  await teste('Empresa: tudo em A1', () => {
    const linha = (texto) => [[texto, null, null], ['outra linha']];
    const casos = [
      ['1 CRV INDUSTRIAL LTDA                    Empresa(s): 1 / 5 /   Data/Hora : 01/01/26 08:00:00', 'crv-matriz'],
      ['5 CRV INDUSTRIAL LTDA                    Empresa(s): 1 / 5 /   Data/Hora : 01/01/26 08:00:00', 'crv-filial'],
      ['1 RUBIATABA INDUSTRIAL S A               Empresa(s): 1 /   Data/Hora : 01/01/26 08:00:00', 'rubi-matriz'],
      ['4 RUBIATABA INDUSTRIAL S A               Empresa(s): 1 / 4 /   Data/Hora : 01/01/26 08:00:00', 'rubi-filial'],
    ];
    casos.forEach(([texto, id]) => {
      const e = identificaEmpresa(linha(texto));
      confere(`"${texto.slice(0, 26).trim()} …" → ${id}`, e && e.id === id, e ? `${e.nome} · ${e.cnpj}` : 'null');
    });
  });

  await teste('Empresa: número em A1 e nome em B1', async () => {
    const e = identificaEmpresa([[5, 'CRV INDUSTRIAL LTDA                 ', 'Data/Hora :', 46000, '08:00:00']]);
    confere('A1 = 5 (número), B1 = "CRV INDUSTRIAL LTDA" → CRV Filial', e && e.id === 'crv-filial', e ? e.nome : 'null');
    const arq = excelFicticio([[1, 'Rubiatába Industrial S A', 'Data/Hora :'], ['outra linha']]);
    const lido = identificaEmpresa((await lerMatrizComTexto(arq)).matriz);
    confere('Mesmo formato lido de um Excel fictício, com acento e minúsculas → Rubi Matriz', lido && lido.id === 'rubi-matriz', lido ? lido.nome : 'null');
  });

  await teste('Empresa: não reconhece', () => {
    const casos = [
      [[['4 CRV INDUSTRIAL LTDA   Empresa(s): 1 / 4 /']], 'CRV com número 4 (não existe)'],
      [[['5 RUBIATABA INDUSTRIAL S A   Empresa(s): 1 / 5 /']], 'Rubi com número 5 (não existe)'],
      [[['1 EMPRESA FICTICIA QUALQUER LTDA   Empresa(s): 1 /']], 'outra empresa'],
      [[['CRV INDUSTRIAL LTDA   Empresa(s): 1 / 5 /']], 'sem número no começo'],
      [[['Pagador Eletrônico:', null, 'CPF/CNPJ:']], 'DDA do banco no lugar do relatório'],
      [[[null, null, null]], '1ª linha vazia'],
      [[], 'planilha vazia'],
    ];
    casos.forEach(([matriz, nome]) => {
      const e = identificaEmpresa(matriz);
      confere(`${nome} → null`, e === null, e ? e.nome : 'null');
    });
  });

  // ---------- Conferência DDA (só nomes e valores fictícios) ----------
  const crvFilial = EMPRESAS.find(e => e.id === 'crv-filial');
  const crvMatriz = EMPRESAS.find(e => e.id === 'crv-matriz');

  // DDA do Santander fictício: linhas 1-4 com a conta (CNPJ da empresa dada), linha 5 cabeçalho, boletos depois
  const ddaSantanderFicticio = (empresa, boletos) => [
    ['Pagador Eletrônico:', null, 'CPF/CNPJ:', null, null],
    ['EMPRESA FICTICIA', null, empresa.cnpj, null, null],
    ['Situação do Título:', 'Todos em aberto', null, null, null],
    ['Origem:', 'Todos', null, null, null],
    ['Vencimento', 'Beneficiário', 'Nosso Número', 'Pagador', 'Valor'],
    ...boletos.map((b, i) => [b.venc, b.nome, String(900000 + i), 'EMPRESA FICTICIA', b.valor]),
  ];
  // relatório do sistema fictício: 1ª linha da empresa, 6 linhas de topo, títulos depois (A venc, C nome, D NF, P saldo)
  const relatorioFicticio = (primeiraLinha, titulos) => [
    [primeiraLinha], [], [], [], [], ['Vencto', null, 'Fornecedor', 'Título'],
    ...titulos.map(t => { const l = new Array(16).fill(null); l[0] = t.venc; l[2] = t.nome; l[3] = t.nf; l[15] = t.valor; return l; }),
  ];
  const LINHA_CRV_FILIAL = '5 CRV INDUSTRIAL LTDA      Empresa(s): 1 / 5 /   Data/Hora : 01/01/26 08:00:00';

  // um boleto e um título para cada status
  const BOLETOS = [
    { venc:'20/11/2026', nome:'ALFA FICTICIA PECAS LTDA',  valor:100.00 },   // Conferidos
    { venc:'21/11/2026', nome:'BETA FICTICIA TINTAS LTDA', valor:200.00 },   // Datas divergentes (sistema 25/11)
    { venc:'20/11/2026', nome:'XPTO FOMENTO MERCANTIL',    valor:300.00 },   // Nome divergente (sistema: GAMA)
    { venc:'20/11/2026', nome:'DELTA FICTICIA CABOS',      valor:400.00 },   // Só no banco
    { venc:'20/11/2026', nome:'EPSILON FICTICIA VIDROS',   valor:600.00 },   // Conferidos com 1 centavo de diferença
  ];
  const TITULOS = [
    { venc:'20/11/2026', nome:'ALFA FICTICIA PECAS',       nf:'1001', valor:100.00 },
    { venc:'25/11/2026', nome:'BETA FICTICIA TINTAS',      nf:'1002', valor:200.00 },
    { venc:'20/11/2026', nome:'GAMA FICTICIA MOVEIS',      nf:'1003', valor:300.00 },
    { venc:'20/11/2026', nome:'ZETA FICTICIA LONAS',       nf:'1005', valor:500.00 },   // Só no sistema
    { venc:'20/11/2026', nome:'EPSILON FICTICIA VIDROS',   nf:'1006', valor:600.01 },
  ];

  await teste('Conferência DDA: um de cada status', () => {
    const r = conferir(leitorSantander(ddaSantanderFicticio(crvFilial, BOLETOS)), extraiSistema(relatorioFicticio(LINHA_CRV_FILIAL, TITULOS)));
    const l = linhasDda(r);
    const nomes = id => l[id].map(x => (x.banco || x.sistema).nome).join(', ');
    confere('Conferidos: valor, nome e vencimento iguais (ALFA e EPSILON)', l.ok.length === 2 && /ALFA/.test(nomes('ok')) && /EPSILON/.test(nomes('ok')), nomes('ok'));
    confere('Datas divergentes: valor e nome iguais, vencimento 21/11 × 25/11 (BETA)', l.data.length === 1 && /BETA/.test(nomes('data')), nomes('data'));
    confere('Nome divergente: só o valor bate (XPTO FOMENTO × GAMA)', l.nome.length === 1 && l.nome[0].sistema.nome === 'GAMA FICTICIA MOVEIS', nomes('nome'));
    confere('Só no banco: boleto de R$ 400,00 sem título (DELTA)', l.banco.length === 1 && /DELTA/.test(nomes('banco')), nomes('banco'));
    confere('Só no sistema: título de R$ 500,00 sem boleto (ZETA)', l.sis.length === 1 && /ZETA/.test(nomes('sis')), nomes('sis'));
    confere('Cartão de Conferidos soma o valor do BOLETO: R$ 700,00', somaValores(l.ok) === 700, brl(somaValores(l.ok)));
  });

  await teste('Conferência DDA: Excel', async () => {
    const r = conferir(leitorSantander(ddaSantanderFicticio(crvFilial, BOLETOS)), extraiSistema(relatorioFicticio(LINHA_CRV_FILIAL, TITULOS)));
    const abas = abasExcelDda(r, 'santander', 'todas');
    confere('5 abas com os mesmos nomes e a mesma ordem da tela', abas.map(a => a.nome).join('|') === STATUS_DDA.map(s => s.nome).join('|'), abas.map(a => a.nome).join(' · '));
    const ok = abas.find(a => a.status === 'ok');
    const total = ok.linhas.reduce((s, l) => s + l[4], 0);
    confere('Excel de Conferidos usa o SALDO DO SISTEMA (R$ 700,01), como no antigo', Math.round(total * 100) === 70001, brl(total));
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(await montaExcel(abas));
    confere('Excel gerado abre e tem as 5 abas', wb.worksheets.length === 5 && wb.worksheets[0].name === 'Conferidos', wb.worksheets.map(w => w.name).join(' · '));
  });

  await teste('Conferência DDA: travas de empresa, banco e conta', () => {
    const relMatriz = relatorioFicticio('1 CRV INDUSTRIAL LTDA      Empresa(s): 1 / 5 /   Data/Hora : 01/01/26 08:00:00', TITULOS);
    const errado = checaRelatorioDda(crvFilial, relMatriz);
    confere('Relatório da CRV Matriz com CRV Filial escolhida → bloqueado', /é da CRV Matriz/.test(errado) && /não foi feita/.test(errado), errado);
    confere('Relatório da empresa escolhida → liberado', checaRelatorioDda(crvFilial, relatorioFicticio(LINHA_CRV_FILIAL, TITULOS)) === '', 'sem alerta');
    const desconhecido = checaRelatorioDda(crvFilial, relatorioFicticio('RELATORIO QUALQUER', TITULOS));
    confere('Relatório sem empresa reconhecida → bloqueado', /Não reconheci/.test(desconhecido), desconhecido);
    const dda = ddaSantanderFicticio(crvFilial, BOLETOS);
    const outroBanco = checaDda('itau', crvFilial, dda);
    confere('DDA do Santander com Itaú escolhido → bloqueado', /DDA do Santander/.test(outroBanco.bloqueio), outroBanco.bloqueio);
    const outraConta = checaDda('santander', crvMatriz, dda);
    confere('DDA da conta da CRV Filial com CRV Matriz escolhida → bloqueado', /conta da CRV Filial/.test(outraConta.bloqueio), outraConta.bloqueio);
    const certo = checaDda('santander', crvFilial, dda);
    confere('DDA do banco e da conta certos → liberado', !certo.bloqueio && !certo.aviso, 'sem alerta');
  });

  await teste('Conferência DDA: Itaú', async () => {
    const linhas = [
      ['Dados da conta'], ['CPF/CNPJ: ' + crvFilial.cnpj], ['Data/Hora: 01/12/2026 às 09:00:00'],
      ['Pagador/Agregado', 'Beneficiário', 'CPF/CNPJ', 'Venc.', 'Nº Doc.', 'Até Venc.', 'A Pagar', 'Tipo de Boleto', 'Banco', 'Observações', 'Código de barras'],
      ['EMPRESA FICTICIA', 'ALFA FICTICIA PECAS LTDA', '00.000.000/0001-00', '20/11/2026', '0001001', 100, 95, 'DM', '341', '', CB],
      ['EMPRESA FICTICIA - UNIDADE CAPINOPOLIS', 'BETA FICTICIA TINTAS LTDA', '00.000.000/0001-00', '21/11/2026', '1002', 200, 200, 'DM', '237', '', CB],
    ];
    const leitura = await lerMatrizComTexto(excelFicticio(linhas, { K6: { t:'n', v:Number(CB) } }));
    const boletos = leitorItau(leitura);
    confere('Lê 2 boletos, Nº Doc. como texto (zeros à esquerda) e "com desconto"',
      boletos.length === 2 && boletos[0].doc === '0001001' && boletos[0].comDesconto && !boletos[1].comDesconto, boletos.map(b => b.doc).join(', '));
    confere('Código de barras vem do TEXTO; o gravado como número fica marcado e não é mostrado',
      boletos[0].codigoBarras === CB && !boletos[0].codigoSuspeito && boletos[1].codigoSuspeito && /ilegível/.test(codigoParaMostrar(boletos[1])), codigoParaMostrar(boletos[1]));
    confere('Filtro de unidade: Todas 2 · CRV Industrial (sem Capinópolis) 1 · Unidade Capinópolis 1',
      boletosDaUnidade(boletos, 'todas').length === 2 && boletosDaUnidade(boletos, 'sem-capinopolis')[0].beneficiario.startsWith('ALFA') &&
      boletosDaUnidade(boletos, 'sem-capinopolis').length === 1 && boletosDaUnidade(boletos, 'capinopolis')[0].beneficiario.startsWith('BETA'), '');
    confere('Nenhum nome de unidade usa "Matriz" (não confundir com a empresa CRV Matriz)',
      Object.values(NOMES_UNIDADE).every(n => !/matriz/i.test(n)), Object.values(NOMES_UNIDADE).join(' · '));
    confere('Data/hora da consulta e CNPJ da conta lidos do topo', dataHoraConsultaItau(leitura.matriz) === '01/12/2026 às 09:00:00' && cnpjDaContaDda(leitura.matriz) === apenasDigitos(crvFilial.cnpj), dataHoraConsultaItau(leitura.matriz));
    const r = conferir(boletos, extraiSistema(relatorioFicticio(LINHA_CRV_FILIAL, TITULOS)));
    confere('Itaú usa a mesma regra: ALFA conferido, BETA data divergente', r.ok.length === 1 && r.datasDiff.length === 1, `ok ${r.ok.length} · datas ${r.datasDiff.length}`);
  });

  await teste('Conferência DDA: tela', () => {
    const area = document.createElement('div');
    const desenho = ligaResultado({ area, status: STATUS_DDA, soma: somaValores, busca: buscaCasa,
      vazio: { ok:'', data:'', nome:'', banco:'', sis:'' },
      colunas: [{ cab:'Fornecedor', celula: l => l.banco.nome }, { cab:'Valor', classe:'num', celula: l => brl(l.valor) }] });
    const l = linhasDda(conferir([{ venc:'', beneficiario:'<img src=x onerror=alert(1)>', valor:1, doc:'', cnpj:'', banco:'' }], []));
    desenho.mostra(l);
    area.querySelector('[data-status="banco"]').click();
    const td = area.querySelector('tbody td');
    confere('Nome com HTML aparece como texto (textContent), sem criar elemento', !area.querySelector('tbody img') && td.textContent.includes('<img'), td.textContent);
    confere('Clicar no cartão abre a aba do status', area.querySelector('.aba[aria-selected="true"]').dataset.status === 'banco', '');
  });

  // ---------- Bradesco: PDFs fictícios ----------
  const rubiMatriz = EMPRESAS.find(e => e.id === 'rubi-matriz');
  const rubiFilial = EMPRESAS.find(e => e.id === 'rubi-filial');
  const pagadorRubi = { pagador:'EMPRESA FICTICIA S.A.', pagadorCnpj:'0' + rubiMatriz.cnpj };
  const BOLETOS_PDF = [
    { ...pagadorRubi, benef:'ALFA FICTICIA PECAS LTDA', cnpj:'011.111.111/0001-11', banco:'237 - BCO BRADESCO S.A.',
      venc:'20/11/2026', limite:'20/12/2026', doc:'0005001', valor:'1.234,56' },
    { ...pagadorRubi, benef:'XPTO FOMENTO MERCANTIL', cnpj:'022.222.222/0001-22', banco:'341 - ITAÚ UNIBANCO S.A.',
      venc:'20/11/2026', limite:'20/11/2036', doc:'**********', valor:'300,00' },
  ];
  // lê um PDF fictício pelo mesmo caminho da tela: pdf.js -> leitorBradesco
  const lePdfFicticio = async (textos, nome) => leitorBradesco(await lerPalavrasPdf(pdfFicticio(textos, nome)), nome);

  await teste('Bradesco: leitura de PDF fictício', async () => {
    const l = await lePdfFicticio(textosDdaBradesco(rubiMatriz.cnpj, BOLETOS_PDF), 'Bradesco_1.pdf');
    confere('Leitura OK: 2 boletos, 2 valores "R$", sem erros', l.boletos.length === 2 && l.qtdRS === 2 && !l.erros.length, l.erros.join(' · ') || `${l.boletos.length} boletos`);
    const [a, b] = l.boletos;
    confere('Campos do 1º boleto: vencimento, limite, Nº Doc., beneficiário, CNPJ, banco, status e valor',
      a.venc === '20/11/2026' && a.limite === '20/12/2026' && a.doc === '0005001' && a.beneficiario === 'ALFA FICTICIA PECAS LTDA' &&
      a.cnpj === '011.111.111/0001-11' && a.banco === '237 - BCO BRADESCO S.A.' && a.status === 'A PAGAR' && a.valor === 1234.56,
      `${a.venc} · ${a.limite} · ${a.doc} · ${a.beneficiario} · ${a.cnpj} · ${a.banco} · ${a.status} · ${a.valor}`);
    confere('Nº Doc. só com asteriscos → sem documento (doc = null)', b.doc === null && b.docTexto === '**********', String(b.doc));
    confere('Topo: empresa, período e total (soma dos boletos)', l.empresa && l.empresa.cnpj === '0' + rubiMatriz.cnpj &&
      l.periodo.join(' a ') === '20/11/2026 a 20/11/2026' && l.total === 1534.56, `${l.empresa && l.empresa.cnpj} · ${l.periodo} · ${brl(l.total)}`);
    const av = avaliaPdfBradesco(l, rubiMatriz, []);
    confere('Pagador e conta = Rubi Matriz escolhida → ok', av.situacao === 'ok', av.erros.join(' · ') || av.situacao);
  });

  await teste('Bradesco: contagem de "R$" diferente bloqueia', async () => {
    const l = await lePdfFicticio(textosDdaBradesco(rubiMatriz.cnpj, BOLETOS_PDF, { semStatus:[0] }), 'Bradesco_2.pdf');
    confere('Boleto sem a linha do status: 2 valores "R$", mas 1 boleto lido → erro', l.qtdRS === 2 && l.boletos.length === 1 &&
      l.erros.some(e => e.includes('2 valores (R$) no PDF, mas 1 boletos lidos')), l.erros.join(' · '));
    const av = avaliaPdfBradesco(l, rubiMatriz, []);
    confere('Esse PDF fica com Erro (não libera o passo 2)', av.situacao === 'erro', av.situacao);
  });

  await teste('Bradesco: PDF repetido é ignorado', async () => {
    const arquivo = pdfFicticio(textosDdaBradesco(rubiMatriz.cnpj, BOLETOS_PDF), 'Bradesco_3.pdf');
    const enviados = [];
    for(const nome of ['Bradesco_3.pdf', 'Bradesco_3 (1).pdf']){
      const leitura = leitorBradesco(await lerPalavrasPdf(arquivo), nome);
      enviados.push({ leitura, ...avaliaPdfBradesco(leitura, rubiMatriz, enviados) });
    }
    confere('O mesmo PDF enviado 2 vezes → o 2º fica "repetido", com o nome do 1º',
      enviados[0].situacao === 'ok' && enviados[1].situacao === 'repetido' && enviados[1].repetidoDe === 'Bradesco_3.pdf', enviados.map(e => e.situacao).join(', '));
    const { boletos } = boletosDosPdfsBradesco(enviados.filter(e => e.situacao === 'ok').map(e => e.leitura));
    confere('Os boletos entram uma vez só (2, não 4)', boletos.length === 2, `${boletos.length} boletos`);
  });

  await teste('Bradesco: outra empresa e colunas deslocadas', async () => {
    const l = await lePdfFicticio(textosDdaBradesco(rubiMatriz.cnpj, BOLETOS_PDF), 'Bradesco_4.pdf');
    const av = avaliaPdfBradesco(l, rubiFilial, []);
    confere('PDF da Rubi Matriz com Rubi Filial escolhida → erro (conta e pagador)', av.situacao === 'erro' && av.erros.some(e => /conta da Rubi Matriz/.test(e)) &&
      av.erros.some(e => /outro pagador/.test(e)), av.erros.join(' · '));
    const d = await lePdfFicticio(textosDdaBradesco(rubiMatriz.cnpj, BOLETOS_PDF, { xBenef:349.5, xValor:524.5 }), 'Bradesco_5.pdf');
    confere('Colunas 13 pt mais à esquerda (como num PDF real): pagador, beneficiário e CNPJ continuam certos',
      !d.erros.length && d.boletos[0].beneficiario === 'ALFA FICTICIA PECAS LTDA' && d.boletos[0].cnpj === '011.111.111/0001-11' && d.boletos[0].pagador === 'EMPRESA FICTICIA S.A.',
      d.erros.join(' · ') || `${d.boletos[0].pagador} | ${d.boletos[0].beneficiario}`);
  });

  await teste('Bradesco: boletos de vários PDFs', () => {
    const bol = (doc, valor) => ({ cnpj:'011.111.111/0001-11', doc, valor, venc:'20/11/2026' });
    const { boletos, repetidos } = boletosDosPdfsBradesco([
      { boletos:[bol('1', 10), bol('1', 10), bol(null, 20)] },
      { boletos:[bol('1', 10), bol(null, 20), bol('2', 30)] },
    ]);
    confere('Mesmo boleto (CNPJ, Nº Doc., valor, vencimento) em outro PDF entra 1 vez; no mesmo PDF ou sem Nº Doc. continua',
      boletos.length === 5 && repetidos === 1, `${boletos.length} boletos, ${repetidos} descartado`);
  });

  // ---------- Bradesco: conferência (nomes e valores fictícios) ----------
  await teste('Bradesco: semelhança de nomes igual ao Python', () => {
    const casos = [['ALFA FICTICIA PECAS', 'ALFA FICTICIA PECAS LTDA', 0.8837209302325582], ['GAMA MOVEIS FICTICIOS', 'XPTO FOMENTO MERCANTIL', 0.32558139534883723],
                   ['ABCD', 'BCDA', 0.75], ['LOJA DO ZE', 'LOJA ZE', 0.8235294117647058], ['PRIMEIRA COISA', 'COISA PRIMEIRA', 0.5714285714285714],
                   ['A'.repeat(250) + 'B', 'B' + 'A'.repeat(250), 0.00398406374501992]];
    casos.forEach(([a, b, esperado]) => {
      const r = semelhancaSequencia(a, b);
      confere(`"${a.slice(0, 22)}" × "${b.slice(0, 22)}" = ${esperado.toFixed(4)} (difflib.SequenceMatcher)`, Math.abs(r - esperado) < 1e-12, String(r));
    });
  });

  const RELATORIO_RUBI = [
    ['1 RUBIATABA INDUSTRIAL S A      Empresa(s): 1 /   Data/Hora : 01/12/26 09:00:00'],
    ['Duplicatas em Aberto'], ['Periodo 20/11/26 a 20/11/26'], [],
    ['Vencimento', 'Código', 'Nome', 'Título', 'Desdobramento', 'Último Desdobramento', 'Prefixo', 'Saldo'],
    [],
    ...[['ALFA FICTICIA PECAS', 100], ['BETA FICTICIA TINTAS', 200], ['GAMA FICTICIA MOVEIS', 300], ['ZETA FICTICIA LONAS', 500], ['EPSILON FICTICIA VIDROS', 600.01]]
      .map(([nome, saldo], i) => [new Date(2026, 10, 20), 9001 + i, nome, String(5001 + i) + '   ', 'A  ', 'A  ', 'NF55', saldo]),
    ['Despesas', 0],
  ];
  const BOLETOS_CONF = [
    { beneficiario:'ALFA FICTICIA PECAS LTDA',  venc:'20/11/2026', valor:100,  doc:'0005001', cnpj:'011.111.111/0001-11', banco:'237 - BCO BRADESCO S.A.' },  // Conferidos
    { beneficiario:'BETA FICTICIA TINTAS',      venc:'21/11/2026', valor:200,  doc:'5002',    cnpj:'', banco:'' },   // Datas divergentes
    { beneficiario:'XPTO FOMENTO MERCANTIL',    venc:'20/11/2026', valor:300,  doc:null,      cnpj:'', banco:'' },   // Nome divergente, factoring, sem Nº Doc.
    { beneficiario:'DELTA FICTICIA CABOS',      venc:'20/11/2026', valor:400,  doc:'7',       cnpj:'', banco:'' },   // Só no banco
    { beneficiario:'EPSILON FICTICIA VIDROS',   venc:'20/11/2026', valor:600,  doc:'5005',    cnpj:'', banco:'' },   // 1 centavo diferente: não casa
    { beneficiario:'OMEGA FICTICIA',            venc:'30/11/2026', valor:50,   doc:'9',       cnpj:'', banco:'' },   // fora das datas do relatório
  ];

  await teste('Bradesco: conferência, um de cada status', () => {
    const { titulos, erro } = extraiSistemaBradesco(RELATORIO_RUBI);
    confere('Relatório Rubi: 5 títulos pelos nomes das colunas (a linha "Despesas" fica de fora), NF sem espaços',
      !erro && titulos.length === 5 && titulos[0].venc === '20/11/2026' && titulos[0].codigo === 9001 && titulos[0].doc === '5001' && titulos[4].valor === 600.01,
      erro || titulos.map(t => `${t.nome} ${t.doc} ${t.valor}`).join(' · '));
    confere('Relatório Rubi Matriz: liberado com Rubi Matriz, bloqueado com Rubi Filial',
      checaRelatorioDda(rubiMatriz, RELATORIO_RUBI) === '' && /é da Rubi Matriz/.test(checaRelatorioDda(rubiFilial, RELATORIO_RUBI)), checaRelatorioDda(rubiFilial, RELATORIO_RUBI));
    const r = conferirBradesco(BOLETOS_CONF, titulos);
    const l = linhasDda(r);
    const nomes = id => l[id].map(x => (x.banco || x.sistema).nome).join(', ');
    confere('Conferidos: ALFA (valor, nome parecido e vencimento)', l.ok.length === 1 && /ALFA/.test(nomes('ok')), nomes('ok'));
    confere('Datas divergentes: BETA (21/11 no banco × 20/11 no sistema)', l.data.length === 1 && /BETA/.test(nomes('data')), nomes('data'));
    confere('Nome divergente: XPTO FOMENTO × GAMA (só valor e vencimento)', l.nome.length === 1 && l.nome[0].sistema.nome === 'GAMA FICTICIA MOVEIS', nomes('nome'));
    confere('Só no banco: DELTA e EPSILON (R$ 600,00 × R$ 600,01: no Bradesco o valor tem que bater ao centavo)',
      l.banco.length === 2 && /DELTA/.test(nomes('banco')) && /EPSILON/.test(nomes('banco')), nomes('banco'));
    confere('Só no sistema: ZETA e EPSILON', l.sis.length === 2 && /ZETA/.test(nomes('sis')) && /EPSILON/.test(nomes('sis')), nomes('sis'));
    confere('Boleto que vence fora das datas do relatório (OMEGA, 30/11) fica separado para o aviso', r.foraDoPeriodo.length === 1 && r.foraDoPeriodo[0].beneficiario === 'OMEGA FICTICIA', '');
    const avisos = avisosBoletoBradesco(l.nome[0].banco, l.nome[0].sistema).map(a => a.tipo).join(',');
    confere('Avisos do XPTO: cedido a factoring e sem Nº Doc.', avisos === 'factoring,semDoc', avisos);
    confere('ALFA não tem aviso', avisosBoletoBradesco(l.ok[0].banco, l.ok[0].sistema).length === 0, '');
  });

  await teste('Bradesco: Excel', async () => {
    const r = conferirBradesco(BOLETOS_CONF, extraiSistemaBradesco(RELATORIO_RUBI).titulos);
    const abas = abasExcelBradesco(r);
    confere('5 abas com os mesmos nomes e a mesma ordem da tela', abas.map(a => a.nome).join('|') === STATUS_DDA.map(s => s.nome).join('|'), abas.map(a => a.nome).join(' · '));
    const nome = abas.find(a => a.status === 'nome');
    confere('Nome divergente traz NF do sistema, Nº Doc. do Bradesco (vazio) e os avisos', nome.linhas[0][3] === '5003' && nome.linhas[0][4] === '' &&
      /factoring/.test(nome.linhas[0][7]) && /sem Nº Doc/.test(nome.linhas[0][7]), nome.linhas[0].join(' | '));
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(await montaExcel(abas));
    const nf = wb.getWorksheet('Conferidos').getRow(3).getCell(4);
    confere('Excel abre, 5 abas, NF gravada como texto', wb.worksheets.length === 5 && nf.value === '5001' && nf.numFmt === '@', `${nf.value} (${nf.numFmt})`);
  });

  mostraResultados();
}

rodaTestes().catch(err => {
  const placar = document.getElementById('placar');
  placar.className = 'placar mensagem mensagem-alerta';
  placar.textContent = 'Os testes não rodaram: ' + (err && err.message || err);
  window.resultadoDosTestes = { total: 0, falhas: 1, erro: String(err) };
});
</script>
