<script>
/* ---------------------------------------------------------------------
   Pequeno executor: cada teste() agrupa várias conferências (confere).
   Um erro dentro do teste vira um resultado vermelho, sem parar os outros.
   --------------------------------------------------------------------- */
const resultados = [];
let grupoAtual = '';

// Guarda um resultado: nome do que foi conferido, se passou e um detalhe para quem lê.
function confere(nome, passou, detalhe){
  resultados.push({ grupo: grupoAtual, nome, passou: !!passou, detalhe: detalhe || '' });
}

// Roda um grupo de conferências; erro inesperado conta como falha.
async function teste(nome, fn){
  grupoAtual = nome;
  try{ await fn(); }catch(err){ confere(nome, false, 'erro: ' + (err && err.message || err)); }
}

// Monta um Excel fictício (SheetJS) com as linhas dadas e devolve como File,
// como se o usuário tivesse escolhido o arquivo. celulas: { 'A2': {t:'n', v:...} } troca células.
function excelFicticio(linhas, celulas){
  const aba = XLSX.utils.aoa_to_sheet(linhas);
  Object.assign(aba, celulas || {});
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, aba, 'Planilha1');
  const bytes = XLSX.write(wb, { type:'array', bookType:'xlsx' });
  return new File([bytes], 'ficticio.xlsx');
}

// Monta um PDF fictício de 1 página (texto em Helvetica) e devolve como File.
// textos = [{ top, x, texto }]: top e x em pontos, contando do canto de cima à esquerda,
// como no PDF do banco. Só letras do Latin-1 (ç, á, é, ô...).
function pdfFicticio(textos, nome){
  const L = 623.63, A = 963.79, TAM = 8.29;
  const escapa = t => t.replace(/[\\()]/g, c => '\\' + c);
  const conteudo = textos.map(({ top, x, texto }) =>
    `BT /F1 ${TAM} Tf 1 0 0 1 ${x.toFixed(2)} ${(A - top - TAM * 0.793).toFixed(2)} Tm (${escapa(texto)}) Tj ET`).join('\n');
  const objetos = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${L} ${A}] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>`,
    `<< /Length ${conteudo.length} >>\nstream\n${conteudo}\nendstream`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
  ];
  let pdf = '%PDF-1.4\n';
  const posicoes = objetos.map((o, i) => { const p = pdf.length; pdf += `${i + 1} 0 obj\n${o}\nendobj\n`; return p; });
  const xref = pdf.length;
  pdf += `xref\n0 ${objetos.length + 1}\n0000000000 65535 f \n` + posicoes.map(p => String(p).padStart(10, '0') + ' 00000 n \n').join('') +
         `trailer\n<< /Size ${objetos.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new File([Uint8Array.from(pdf, c => c.charCodeAt(0))], nome || 'Bradesco_ficticio.pdf', { type:'application/pdf' });
}

// Textos de um DDA do Bradesco fictício, no layout do PDF do banco: topo (empresa, período),
// cabeçalho da tabela, um bloco de 6 linhas por boleto e o rodapé "SAC".
// opcoes: xBenef/xValor = onde começam as colunas do beneficiário e do valor (para simular
// o PDF com colunas deslocadas); semStatus = índices dos boletos sem a linha "A PAGAR";
// valorGrudado = cabeçalho com "DestinatárioValor" numa palavra só (como alguns PDFs do banco);
// xRotuloValor = x da palavra "Valor" do cabeçalho, quando ela não fica em cima dos "R$";
// benefNaLinhaDoPagador = "Beneficiário," na mesma linha de "Pagador," (outro layout do banco).
function textosDdaBradesco(cnpjConta, boletos, opcoes){
  const { xBenef = 362.9, xValor = 540.5, semStatus = [], valorGrudado = false, xRotuloValor = xValor,
          benefNaLinhaDoPagador = false } = opcoes || {};
  const topBenef = benefNaLinhaDoPagador ? 235.8 : 241.2;
  const cabecalhoValor = valorGrudado
    ? [{ top:topBenef, x:xBenef - 7.5, texto:'Beneficiário, CPF/CNPJ e Banco DestinatárioValor' }]
    : [{ top:topBenef, x:xBenef - 7.5, texto:'Beneficiário, CPF/CNPJ e Banco Destinatário' }, { top:241.2, x:xRotuloValor, texto:'Valor' }];
  const t = [
    { top:43,    x:155.1, texto:'Boletos de Cobrança Registrados/DDA' },
    { top:58,    x:155.1, texto:'EMPRESA FICTICIA S.A | 0' + cnpjConta },
    { top:82.9,  x:155.1, texto:'Data da operação : 01/12/2026 - 09h00' },
    { top:209.8, x:50.5,  texto:'Data de Vencimento:' },
    { top:210,   x:137.8, texto:'20/11/2026 até 20/11/2026' },
    { top:235.8, x:180.7, texto:'Pagador, CPF/CNPJ e' },
    { top:239.5, x:40.3,  texto:'Data de Vencimento /' },
    ...cabecalhoValor,
    { top:246.6, x:180.7, texto:'Número de documento' },
    { top:250.3, x:40.3,  texto:'Débito e Limite de Pagamento' },
  ];
  boletos.forEach((b, k) => {
    const y = 273 + 48.2 * k;
    t.push({ top:y, x:188.2, texto:b.pagador }, { top:y, x:xBenef, texto:b.benef },
           { top:y + 7.5, x:40.3, texto:b.venc }, { top:y + 7.6, x:xValor, texto:'R$ ' + b.valor },
           { top:y + 10.8, x:188.2, texto:b.pagadorCnpj }, { top:y + 10.8, x:xBenef, texto:b.cnpj },
           { top:y + 18.3, x:40.3, texto:b.limite },
           { top:y + 21.6, x:188.2, texto:b.doc }, { top:y + 21.6, x:xBenef, texto:b.banco });
    if(!semStatus.includes(k)) t.push({ top:y + 29.2, x:40.3, texto:'A PAGAR' });
  });
  const fim = 273 + 48.2 * boletos.length + 20;
  t.push({ top:fim, x:51.9, texto:'SAC - Serviço de Alô Bradesco' }, { top:fim + 34, x:47.8, texto:'Ouvidoria 0800 000 0000' });
  return t;
}

// Desenha o placar e a lista (com textContent: o detalhe pode ter texto qualquer).
function mostraResultados(){
  const lista = document.getElementById('lista');
  resultados.forEach(r => {
    const li = document.createElement('li');
    li.className = r.passou ? 'ok' : 'falha';
    const marca = document.createElement('span');
    marca.className = 'marca'; marca.setAttribute('aria-hidden', 'true');
    marca.textContent = r.passou ? '✓' : '✗';
    const corpo = document.createElement('div');
    const grupo = document.createElement('p'); grupo.className = 'grupo-teste'; grupo.textContent = r.grupo;
    const nome = document.createElement('p'); nome.className = 'nome'; nome.textContent = r.nome;
    corpo.append(grupo, nome);
    if(r.detalhe){ const d = document.createElement('p'); d.className = 'detalhe'; d.textContent = r.detalhe; corpo.append(d); }
    li.append(marca, corpo);
    lista.append(li);
  });
  const falhas = resultados.filter(r => !r.passou).length;
  const placar = document.getElementById('placar');
  placar.className = 'placar mensagem ' + (falhas ? 'mensagem-alerta' : 'mensagem-ok');
  placar.textContent = falhas ? `✗ ${falhas} de ${resultados.length} testes falharam` : `✓ Todos os ${resultados.length} testes passaram`;
  document.title = (falhas ? '✗ ' : '✓ ') + 'Testes da Conferência';
  window.resultadoDosTestes = { total: resultados.length, falhas, resultados };
}

/* ---------------------------------------------------------------------
   TESTES — só dados fictícios
   --------------------------------------------------------------------- */
async function rodaTestes(){
  // boleto fictício: banco 341, R$ 1.234,56, vencimento 23/10/2026 (do projeto antigo)
  const ESP = { banco:'341', valor:1234.56, venc:'23/10/2026' };
  const CB = '34191160800001234561234567890123456789012345';
  const LINHA = '34191234546789012345767890123457116080000123456';

  // ---------- módulo de boleto (testes do projeto antigo) ----------
  await teste('Boleto: código válido', () => {
    const r = validaBoleto(CB, ESP);
    const d = decodifica(CB);
    confere('Código válido → linha digitável certa', r.ok && r.linha === LINHA, `linha ${r.linha}`);
    confere('Código válido → banco 341, valor R$ 1.234,56, vencimento 23/10/2026',
      d.banco === '341' && d.valor === 1234.56 && d.venc === '23/10/2026', `banco ${d.banco} · ${brl(d.valor)} · ${d.venc}`);
    confere('Linha digitável → volta para o mesmo código de barras', linhaParaBarras(LINHA) === CB && validaBoleto(LINHA, ESP).cb === CB, linhaParaBarras(LINHA));
  });

  await teste('Boleto: um dígito trocado', () => {
    const r = validaBoleto('34191234546789012345767891123457116080000123456', ESP);
    confere('Um dígito trocado na linha → bloqueado, sem linha digitável', !r.ok && r.linha === '' && r.cb === '', r.motivo);
  });

  await teste('Boleto: código vindo como número', () => {
    const r = validaBoleto('3.4191160800001234e+43', ESP);
    confere('Código "3.4191160800001234e+43" → bloqueado como "ilegível"', !r.ok && r.linha === '' && /ilegível/.test(r.motivo), r.motivo);
  });

  // ---------- módulo de boleto (outros bloqueios do mesmo código antigo) ----------
  await teste('Boleto: DVs', () => {
    confere('DV geral (módulo 11) do código fictício = 1', dvMod11Geral(CB) === 1 && CB[4] === '1', `DV ${dvMod11Geral(CB)}`);
    confere('DVs dos 3 campos (módulo 10) = 4, 7 e 7', dvMod10(LINHA.slice(0, 9)) === 4 && dvMod10(LINHA.slice(10, 20)) === 7 && dvMod10(LINHA.slice(21, 31)) === 7,
      `${dvMod10(LINHA.slice(0, 9))}, ${dvMod10(LINHA.slice(10, 20))}, ${dvMod10(LINHA.slice(21, 31))}`);
    const trocaDv = CB.slice(0, 4) + '2' + CB.slice(5);
    const r = validaEstrutura(trocaDv);
    confere('DV geral errado → bloqueado', !r.ok && /módulo 11/.test(r.motivo), r.motivo);
  });

  await teste('Boleto: comparação com o DDA', () => {
    const banco = validaBoleto(CB, { ...ESP, banco:'237' });
    confere('Banco do DDA diferente → bloqueado', !banco.ok && banco.linha === '' && /banco do código/.test(banco.motivo), banco.motivo);
    const valor = validaBoleto(CB, { ...ESP, valor:1234.57 });
    confere('Valor do DDA 1 centavo diferente → bloqueado', !valor.ok && valor.linha === '' && /valor do código/.test(valor.motivo), valor.motivo);
    const venc = validaBoleto(CB, { ...ESP, venc:'24/10/2026' });
    confere('Vencimento diferente → não bloqueia, só avisa', venc.ok && venc.avisos.length === 1, venc.avisos.join(' · '));
  });

  await teste('Boleto: o que não é boleto', () => {
    const consumo = validaEstrutura('8' + '1'.repeat(47));
    confere('48 dígitos começando com 8 → conta de consumo, sem linha', !consumo.ok && consumo.tipo === 'consumo' && consumo.linha === '', consumo.motivo);
    const curto = validaEstrutura(CB.slice(0, 43));
    confere('43 dígitos → bloqueado pelo tamanho', !curto.ok && /tem 43 dígitos/.test(curto.motivo), curto.motivo);
    const letra = validaEstrutura(CB.slice(0, 10) + 'A' + CB.slice(11));
    confere('Letra no meio do código → bloqueado', !letra.ok && /não são números/.test(letra.motivo), letra.motivo);
    const vazio = validaEstrutura('');
    confere('Sem código → bloqueado', !vazio.ok && /sem código/.test(vazio.motivo), vazio.motivo);
  });

  await teste('Boleto: formato impresso', () => {
    confere('Linha formatada com pontos e espaços, sem mudar nenhum dígito',
      formataLinha(LINHA) === '34191.23454 67890.123457 67890.123457 1 16080000123456' && apenasDigitos(formataLinha(LINHA)) === LINHA, formataLinha(LINHA));
  });

  // ---------- leitura do Excel: código como texto ----------
  await teste('Leitura: código de barras no Excel', async () => {
    const arq = excelFicticio([['Código de barras'], [CB], [null]], { A3: { t:'n', v:Number(CB) } });
    const leitura = await lerMatrizComTexto(arq);
    const texto = codigoBarrasDaCelula(leitura, 1, 0);
    confere('Código gravado como texto → os 44 dígitos iguais, não suspeito', !texto.suspeito && texto.digitos === CB && validaBoleto(leitura.textoDe(1, 0).texto, ESP).ok, texto.digitos);
    const numero = codigoBarrasDaCelula(leitura, 2, 0);
    const v = validaEstrutura(leitura.textoDe(2, 0).texto);
    confere('Código gravado como número → suspeito e bloqueado (nunca vira os 44 dígitos certos)',
      numero.suspeito && numero.digitos !== CB && !v.ok, `texto lido "${leitura.textoDe(2, 0).texto}" · ${v.motivo}`);
    confere('Número da linha no Excel = 3 para a 3ª linha', leitura.linhaExcel(2) === 3, `linha ${leitura.linhaExcel(2)}`);
  });

  // ---------- identificaEmpresa (1ª linha fictícia de cada formato) ----------
  await teste('Empresa: tudo em A1', () => {
    const linha = (texto) => [[texto, null, null], ['outra linha']];
    const casos = [
      ['1 CRV INDUSTRIAL LTDA                    Empresa(s): 1 / 5 /   Data/Hora : 01/01/26 08:00:00', 'crv-matriz'],
      ['5 CRV INDUSTRIAL LTDA                    Empresa(s): 1 / 5 /   Data/Hora : 01/01/26 08:00:00', 'crv-filial'],
      ['1 RUBIATABA INDUSTRIAL S A               Empresa(s): 1 /   Data/Hora : 01/01/26 08:00:00', 'rubi-matriz'],
      ['4 RUBIATABA INDUSTRIAL S A               Empresa(s): 1 / 4 /   Data/Hora : 01/01/26 08:00:00', 'rubi-filial'],
    ];
    casos.forEach(([texto, id]) => {
      const e = identificaEmpresa(linha(texto));
      confere(`"${texto.slice(0, 26).trim()} …" → ${id}`, e && e.id === id, e ? `${e.nome} · ${e.cnpj}` : 'null');
    });
  });

  await teste('Empresa: número em A1 e nome em B1', async () => {
    const e = identificaEmpresa([[5, 'CRV INDUSTRIAL LTDA                 ', 'Data/Hora :', 46000, '08:00:00']]);
    confere('A1 = 5 (número), B1 = "CRV INDUSTRIAL LTDA" → CRV Filial', e && e.id === 'crv-filial', e ? e.nome : 'null');
    const arq = excelFicticio([[1, 'Rubiatába Industrial S A', 'Data/Hora :'], ['outra linha']]);
    const lido = identificaEmpresa((await lerMatrizComTexto(arq)).matriz);
    confere('Mesmo formato lido de um Excel fictício, com acento e minúsculas → Rubi Matriz', lido && lido.id === 'rubi-matriz', lido ? lido.nome : 'null');
  });

  await teste('Empresa: não reconhece', () => {
    const casos = [
      [[['4 CRV INDUSTRIAL LTDA   Empresa(s): 1 / 4 /']], 'CRV com número 4 (não existe)'],
      [[['5 RUBIATABA INDUSTRIAL S A   Empresa(s): 1 / 5 /']], 'Rubi com número 5 (não existe)'],
      [[['1 EMPRESA FICTICIA QUALQUER LTDA   Empresa(s): 1 /']], 'outra empresa'],
      [[['CRV INDUSTRIAL LTDA   Empresa(s): 1 / 5 /']], 'sem número no começo'],
      [[['Pagador Eletrônico:', null, 'CPF/CNPJ:']], 'DDA do banco no lugar do relatório'],
      [[[null, null, null]], '1ª linha vazia'],
      [[], 'planilha vazia'],
    ];
    casos.forEach(([matriz, nome]) => {
      const e = identificaEmpresa(matriz);
      confere(`${nome} → null`, e === null, e ? e.nome : 'null');
    });
  });

  // ---------- Conferência DDA (só nomes e valores fictícios) ----------
  const crvFilial = EMPRESAS.find(e => e.id === 'crv-filial');
  const crvMatriz = EMPRESAS.find(e => e.id === 'crv-matriz');

  // DDA do Santander fictício: linhas 1-4 com a conta (CNPJ da empresa dada), linha 5 cabeçalho, boletos depois
  const ddaSantanderFicticio = (empresa, boletos) => [
    ['Pagador Eletrônico:', null, 'CPF/CNPJ:', null, null],

  // f(fornecedor, nome, nf, desd, valor, venc) monta um título com código do fornecedor e desdobramento.
  const f = (fornecedor, nome, nf, desd, valor, venc) => ({ ...t(nome, valor, venc, nf), fornecedor, desd });
  await teste('Relatório contra relatório: mesma linha nos dois relatórios', () => {
    const A = [
      f('901', 'SIGMA FICTICIA LTDA', '4001', 'A', 700.00, '10/12/2026'),   // igual em B → mesma linha
      f('902', 'TAU FICTICIA LTDA',   '4002', 'A', 800.00, '10/12/2026'),   // em B com outro desdobramento
      f('903', 'OMICRON FICTICIA LTDA','4003', 'A', 900.00, '10/12/2026'),  // em B com outro vencimento
      f('904', 'KAPPA FICTICIA LTDA', '4004', 'A', 950.00, '10/12/2026'),   // 2 vezes em A, 1 em B
      f('904', 'KAPPA FICTICIA LTDA', '4004', 'A', 950.00, '10/12/2026'),
    ];
    const B = [
      f('901', 'SIGMA FICTICIA LTDA', '4001', 'A', 700.00, '10/12/2026'),
      f('902', 'TAU FICTICIA LTDA',   '4002', 'B', 800.00, '10/12/2026'),
      f('903', 'OMICRON FICTICIA LTDA','4003', 'A', 900.00, '11/12/2026'),
      f('904', 'KAPPA FICTICIA LTDA', '4004', 'A', 950.00, '10/12/2026'),
    ];
    const r = conferirRelatorios(A, B);
    const nomes = lista => lista.map(g => g.a[0].nome.split(' ')[0]).join(',');
    confere('Mesmo código do fornecedor, NF, desdobramento, valor e vencimento → "Mesma linha", fora da conferência',
      r.linha.some(g => g.a[0].nome.startsWith('SIGMA')) && ![...r.mesmo, ...r.duplo].some(g => g.a[0].nome.startsWith('SIGMA')), `linha: ${nomes(r.linha)} · duplo: ${nomes(r.duplo)}`);
    confere('Desdobramento diferente → NÃO é a mesma linha: continua em "Mesmo fornecedor e valor"',
      r.duplo.some(g => g.a[0].nome.startsWith('TAU')) && !r.linha.some(g => g.a[0].nome.startsWith('TAU')), `duplo: ${nomes(r.duplo)}`);
    confere('Vencimento diferente → NÃO é a mesma linha: continua em "Mesmo fornecedor e valor"',
      r.duplo.some(g => g.a[0].nome.startsWith('OMICRON')) && !r.linha.some(g => g.a[0].nome.startsWith('OMICRON')), `duplo: ${nomes(r.duplo)}`);
    const kappaLinha = r.linha.filter(g => g.a[0].nome.startsWith('KAPPA')).length;
    const kappaDuplo = r.duplo.find(g => g.a[0].nome.startsWith('KAPPA'));
    confere('Linha 2 vezes em A e 1 em B: só 1 par sai como mesma linha (a sobra de A não tem par em B e não casa)',
      kappaLinha === 1 && !kappaDuplo, `linha: ${kappaLinha} · duplo: ${kappaDuplo ? kappaDuplo.a.length + '×' + kappaDuplo.b.length : '-'}`);
    const semCodigo = conferirRelatorios([t('SIGMA FICTICIA LTDA', 700, '10/12/2026', '4001')], [t('SIGMA FICTICIA LTDA', 700, '10/12/2026', '4001')]);
    confere('Sem o código do fornecedor não dá para dizer que é a mesma linha → continua na conferência',
      semCodigo.linha.length === 0 && semCodigo.duplo.length === 1, `${semCodigo.linha.length} · ${semCodigo.duplo.length}`);

    const EA = EMPRESAS.find(e => e.id === 'rubi-matriz'), EB = EMPRESAS.find(e => e.id === 'rubi-filial');
    const area = document.createElement('div');
    const desenho = ligaResultado({ area, status: STATUS_RR, colunas: colunasTelaRr(EA, EB), soma: somaValores, busca: buscaCasa,
                                    vazio: { mesmo:'', duplo:'', linha:'' } });
    desenho.mostra(linhasRelatorios(r));
    const cartao = area.querySelector('.cartao[data-status="linha"]');
    confere('Cartão "Mesma linha nos dois relatórios": só a contagem (2), sem total',
      cartao && cartao.querySelector('.cartao-nome').textContent === 'Mesma linha nos dois relatórios' && cartao.querySelector('.cartao-qtd').textContent === '2' && !cartao.querySelector('.cartao-total'),
      cartao ? cartao.textContent : 'sem cartão');
    cartao.click();
    const rodape = area.querySelector('tfoot tr');
    confere('Aba "Mesma linha": a lista com 2 linhas e rodapé sem soma', area.querySelectorAll('tbody tr').length === 2 && rodape.children.length === 1 && !/R\$/.test(rodape.textContent), rodape.textContent);
    const aba = abasExcelRelatorios(r, EA, EB).find(a => a.nome === 'Mesma linha nos dois relatórios');
    confere('Excel: aba "Mesma linha nos dois relatórios" com as mesmas 2 linhas', aba && aba.linhas.length === 2, aba ? String(aba.linhas.length) : 'sem aba');
  });

  mostraResultados();
}

rodaTestes().catch(err => {
  const placar = document.getElementById('placar');
  placar.className = 'placar mensagem mensagem-alerta';
  placar.textContent = 'Os testes não rodaram: ' + (err && err.message || err);
  window.resultadoDosTestes = { total: 0, falhas: 1, erro: String(err) };
});
</script>
